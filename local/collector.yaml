# Приём всего без авторизации и без маскировки -> ClickHouse. Таблицы создаёт экспортёр.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    ttl: 720h
    create_schema: true
    retry_on_failure:
      enabled: true

service:
  pipelines:
    logs:    {receivers: [otlp], processors: [batch], exporters: [clickhouse]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [clickhouse]}
    traces:  {receivers: [otlp], processors: [batch], exporters: [clickhouse]}
