<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hottell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: product shell — two-row header, dense panels on a 12-col grid; v5.1 «Живые данные» / «Глубокий разбор». */
:root{
  color-scheme: light;
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f5; --hover:#e6ebf2; --line:#dde2ea;
  --ink:#131820; --ink-2:#465264; --ink-3:#737f90;
  --accent:#0f62fe; --accent-2:#6e9cff; --accent-soft:#e5edff;
  --m1:#0f62fe; --m2:#8a3ffc; --m3:#08bdba; --m4:#ee8a1a;
  --ok:#198038; --ok-soft:#defbe6; --warn:#a15c00; --warn-soft:#fcf0dc; --bad:#da1e28; --bad-soft:#fff1f1;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --hover:#242b36; --line:#2b323d;
    --ink:#e8edf3; --ink-2:#aeb8c6; --ink-3:#7f8a9a;
    --accent:#78a9ff; --accent-2:#4d7fd9; --accent-soft:#1a2740;
    --m1:#78a9ff; --m2:#be95ff; --m3:#3ddbd9; --m4:#ffb35c;
    --ok:#42be65; --ok-soft:#10301c; --warn:#f1c21b; --warn-soft:#33290c; --bad:#ff8389; --bad-soft:#3a1618;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --hover:#242b36; --line:#2b323d;
  --ink:#e8edf3; --ink-2:#aeb8c6; --ink-3:#7f8a9a;
  --accent:#78a9ff; --accent-2:#4d7fd9; --accent-soft:#1a2740;
  --m1:#78a9ff; --m2:#be95ff; --m3:#3ddbd9; --m4:#ffb35c;
  --ok:#42be65; --ok-soft:#10301c; --warn:#f1c21b; --warn-soft:#33290c; --bad:#ff8389; --bad-soft:#3a1618;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);overflow-x:hidden}
button,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--ink-3)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;min-height:52px}
.brand{font:600 15px/1 var(--f-mono);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:0;overflow-x:auto;margin-left:auto;max-width:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:16px 12px 14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab:focus-visible,.seg button:focus-visible,tr.row:focus-visible,.link:focus-visible,.cstep:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row2{border-top:1px solid var(--line)}
.row2-in{max-width:1280px;margin:0 auto;padding:7px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{background:var(--surface);border:0;padding:5px 10px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg[hidden]{display:none}
.versions{font-size:13px}
.seg a{background:var(--surface);padding:6px 10px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.seg a+a,.seg a+span,.seg span+a{border-left:1px solid var(--line)}
.seg span.cur{background:var(--ink);color:var(--surface);padding:6px 10px;white-space:nowrap}
select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:5px 8px;max-width:100%}
.hright{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.send{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.send b{font-weight:500}
.send .muted{color:var(--ink-3)}
#refresh{padding:5px 10px;font-size:12.5px;white-space:nowrap}
/* pulse */
.pulse{position:relative}
.pbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:3px 4px;cursor:pointer;font:12px var(--f-mono);color:var(--ink-2)}
.pbox{display:block;width:179px;height:16px;overflow:hidden;flex:none}
.pbars{display:flex;gap:1px;align-items:flex-end;height:16px;width:179px}
.pbars span{width:2px;flex:none;height:16px;display:flex;flex-direction:column-reverse}
.pbars i{display:block}
.pdot{position:relative;width:7px;height:7px;display:inline-block;flex:none}
.pdot i{position:absolute;inset:0;border-radius:50%;background:var(--ok)}
.pdot i.ring{opacity:0}
.pdot.off i{background:var(--ink-3)}
.plabel{white-space:nowrap}
.pdrop{position:absolute;top:calc(100% + 6px);right:0;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:10;display:grid}
.pdrop .h{padding:10px 14px;border-bottom:1px solid var(--line);font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.pdrop .a{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.pdrop .a:last-child{border-bottom:0}
.pdrop .a .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pdrop .a .f{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdrop .none{padding:12px 14px;color:var(--ink-3);font-size:13px}
/* page */
main{max-width:1280px;margin:0 auto;padding:20px 16px 56px}
.view{display:grid;gap:16px;min-width:0}
.view[hidden]{display:none}
.view>*{min-width:0}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.g84{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:16px;align-items:start}
.col16{display:grid;gap:16px;min-width:0}
.p{background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph h2{font-size:14px;font-weight:600;margin:0}
.ph .sub{font-size:12px;color:var(--ink-3)}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;font-weight:600;margin:0}
.sec-h .sub{font-size:12px;color:var(--ink-3)}
.sec-h .end{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font:12px var(--f-mono);color:var(--ink-3)}
.kpi .d.bad{color:var(--bad)}.kpi .d.ok{color:var(--ok)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal}
.r{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
.tag{display:inline-block;font:500 11px/1 var(--f-mono);padding:4px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.claude{background:var(--accent-soft);color:var(--accent)}
.tag.codex{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.muted{color:var(--ink-3)}
.tag.sm{font-size:10.5px;padding:3px 5px}
.flags{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.bar{height:6px;background:var(--surface-2);position:relative;min-width:40px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.info i{background:var(--ink-3)}
.bar.m2 i{background:var(--m2)}.bar.m4 i{background:var(--m4)}
.obar{height:8px;display:flex;background:var(--line);min-width:80px}
.obar i{display:block;height:8px}
.obar.nosplit,.legend i.nosplit{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--surface-2) 3px 6px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
.sev{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--ink-3)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--ink-3)}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows>*{border-top:1px solid var(--line)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
.lbl{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:8px 14px;font-size:13.5px}
.btn.quiet{color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.idc{background:none;border:0;padding:0;cursor:pointer;font:12.5px var(--f-mono);color:var(--ink-2)}
code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:1px 4px}
pre.snip{margin:0;background:var(--bg);border:1px solid var(--line);padding:10px 12px;font:12.5px/1.55 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{padding:24px;text-align:center;color:var(--ink-3)}
.state{padding:40px 16px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.state pre{display:inline-block;text-align:left;margin:12px 0 0}
.cov{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:8px 12px}
details.box{background:var(--surface);border:1px solid var(--line);padding:12px 16px;font-size:13px}
details.box summary{cursor:pointer;color:var(--ink-2)}
details.box>ul{margin:10px 0 0;padding-left:18px;display:grid;gap:5px;color:var(--ink-2)}
/* «Что исправить»: cycle */
.cycle{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);position:relative}
.cstep{background:var(--surface);border:0;border-left:1px solid var(--line);padding:12px 16px;text-align:left;cursor:pointer;display:grid;gap:2px;min-width:0}
.cstep:first-child{border-left:0}
.cstep[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.cstep .cl{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.cstep .cl b{color:var(--ink-3);font-weight:400}
.cstep .cn{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.cstep .cn.ok{color:var(--ok)}
.cstep .cn small{font-size:13px;font-weight:400;color:var(--ink-3)}
.cstep .cs{font:11.5px var(--f-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chint{grid-column:4 / 7;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px 16px;font-size:12px;color:var(--ink-3)}
.cdot{position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent);pointer-events:none;opacity:0}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:20px}
.hero h1{margin:0;font-size:22px;font-weight:600;line-height:1.25}
.hero .hs{color:var(--ink-2);font-size:13.5px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.cmdslot{grid-column:1 / -1;min-width:0}
.cmdslot:empty{display:none}
.cmd{grid-column:1 / -1;display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);padding:10px 12px;min-width:0}
.cmd .m{font-size:12.5px;color:var(--ink-2)}
.cmd .c{display:flex;gap:8px;align-items:center;min-width:0}
.cmd code{flex:1;min-width:0;font:12.5px var(--f-mono);background:none;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .x{background:none;border:0;padding:5px 4px;cursor:pointer;font-size:12.5px;color:var(--ink-3)}
/* topics */
.topics{display:grid;gap:10px}
.topic{background:var(--surface);border:1px solid var(--line);display:grid;position:relative;min-width:0;scroll-margin-top:112px}
.topic::after{content:"";position:absolute;inset:-1px;box-shadow:inset 3px 0 0 var(--accent);opacity:0;pointer-events:none}
.topic.flash::after{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.t-top{padding:14px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center;min-width:0}
.t-h{display:flex;gap:8px;align-items:center;min-width:0}
.t-h .ttl{font-weight:600;font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t-price{font-size:13px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.t-price b{color:var(--ink);font-weight:600}
.t-why{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.t-tog{text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 16px;color:var(--ink-2);font-size:13px;cursor:pointer}
.t-open{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border-top:1px solid var(--line)}
.t-l{padding:14px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.t-l>p{margin:0;color:var(--ink-2);font-size:13px}
.t-r{padding:14px 16px;display:grid;gap:12px;align-content:start;border-left:1px solid var(--line);background:var(--surface-2);min-width:0}
.t-r code.w{font:12px var(--f-mono);color:var(--ink-2);background:none;padding:0;overflow-wrap:anywhere}
.blk{display:grid;gap:6px;min-width:0}
.evr{display:grid;grid-template-columns:170px 88px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:13px}
.evr .link{font:12.5px var(--f-mono);text-align:left}
.evr .tm{font:12px var(--f-mono);color:var(--ink-3)}
.evr .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axes{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.axes span:nth-child(odd){color:var(--ink-3)}
ul.pre{margin:0;padding-left:18px;font-size:13px;display:grid;gap:2px}
/* journal */
.jlist{background:var(--surface);border:1px solid var(--line);display:grid;min-width:0}
.jrow{border-bottom:1px solid var(--line);min-width:0}
.jrow:last-child{border-bottom:0}
.jrow.enter{animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.jbtn{width:100%;background:none;border:0;padding:10px 16px;cursor:pointer;text-align:left;display:grid;grid-template-columns:52px 96px minmax(140px,240px) minmax(0,1fr) auto;gap:14px;align-items:center;font-size:13.5px}
.jbtn:hover{background:var(--hover)}
.jbtn .el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.jdet{padding:2px 16px 14px 82px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;font-size:13px}
.jdet>span:nth-child(odd){color:var(--ink-3)}
.jdet .ev{display:block}
.jempty{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.jempty b{font-weight:500}
/* health */
.hcards{display:grid;gap:10px;margin-top:12px}
.hc{border:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;min-width:0}
.hc .hh{display:flex;gap:8px;align-items:center;min-width:0;font-weight:600}
.hc .full{grid-column:1 / -1;min-width:0}
.hc pre.snip{padding:8px 10px;font-size:12px}
/* overview charts */
.dchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font:10.5px var(--f-mono);color:var(--ink-3);text-align:right;white-space:nowrap}
.cols{display:flex;align-items:stretch;min-width:0}
.dcol{flex:1;min-width:0;display:grid;gap:4px}
.dcol .stk{display:flex;flex-direction:column-reverse;border-bottom:1px solid var(--line)}
.dcol .pair{display:flex;gap:2px;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.dcol .pair i{display:block;width:40%}
.dcol .dl{font:10.5px var(--f-mono);color:var(--ink-3);text-align:center;white-space:nowrap;overflow:visible;height:14px}
.top6 button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;text-align:left;cursor:pointer;font-size:13px;width:100%}
.top6 button:hover{background:var(--hover)}
.top6 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frm{display:grid;grid-template-columns:8px minmax(0,1fr) 84px 64px 64px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
/* sessions */
.sesst{table-layout:fixed;min-width:1100px}
.sesst td{padding:7px 8px;height:36px}
.sesst td.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sesst tr.sys td{color:var(--ink-3)}
/* session */
.sess-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:start}
.sess-h{display:grid;gap:8px;min-width:0}
.sess-h h1{font-size:20px;font-weight:600;margin:0;line-height:1.35;overflow-wrap:anywhere}
.sess-h h1.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);align-items:center}
.sess-d{display:grid;gap:4px;justify-items:end}
.sess-d .acts{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.st{background:var(--surface);padding:10px 12px;display:grid;gap:2px;min-width:0}
.st .l{font-size:11.5px;color:var(--ink-3)}
.st .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok)}
#tl{position:relative;display:grid;max-height:900px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.ev{display:grid;grid-template-columns:48px 12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .t{font:12px/1.5 var(--f-mono);color:var(--ink-3)}
.ev .ic{width:10px;height:10px;margin-top:4px;border:2px solid var(--ink-3);border-radius:50%}
.ev.prompt .ic{background:var(--accent);border-color:var(--accent)}
.ev.answer .ic{background:var(--ok);border-color:var(--ok)}
.ev.err .ic{background:var(--bad);border-color:var(--bad)}
.ev.abort .ic{border-color:var(--bad);border-radius:0}
.ev.wait .ic,.ev.compact .ic{border-color:var(--warn);border-radius:0}
.ev.skill .ic{background:var(--m2);border-color:var(--m2)}
.ev.agent .ic{background:var(--m3);border-color:var(--m3)}
.ev.api .ic{border-color:var(--m2)}
.ev .body{min-width:0;display:grid;gap:2px}
.ev .body .x{overflow-wrap:anywhere}
.ev.prompt .x{font-weight:500}
.ev.tool .x,.ev.err .x{font:12.5px var(--f-mono)}
.ev .side{font:12px var(--f-mono);color:var(--ink-3);text-align:right;white-space:nowrap}
.ev .note{font-size:12px;color:var(--ink-3)}
.ev.err .note,.ev.abort .note{color:var(--bad)}
.ev.hl{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.turn-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 0 6px;font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-bottom:1px solid var(--line)}
.turn-h:first-child{padding-top:0}
.newev{position:sticky;bottom:8px;justify-self:center;margin-top:8px;background:var(--accent);color:#fff;border:0;padding:5px 12px;font-size:12.5px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.src{display:grid;grid-template-columns:110px auto;gap:4px 10px;align-items:baseline;font-size:13px}
.src .n{grid-column:1 / -1;font-size:12px;color:var(--ink-3)}
.ck{display:grid;grid-template-columns:44px minmax(120px,190px) 1fr;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.ck .s{grid-column:3;color:var(--ink-2)}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.obs{display:grid;gap:4px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.lines{display:inline-flex;gap:6px;flex-wrap:wrap}
.scroll{max-height:760px;overflow-y:auto;overscroll-behavior:contain}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font:10.5px var(--f-mono)}
.chart .grid line{stroke:var(--line)}
/* skills */
.skh{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);padding:18px 20px}
.skh h1{margin:0;font-size:22px;font-weight:600;line-height:1.25}
.skh span{color:var(--ink-2);font-size:13.5px}
.grp{display:grid;grid-template-columns:96px minmax(0,1fr) 28px 34px;gap:10px;align-items:center;font-size:13px}
.big{font-size:26px;font-weight:600;line-height:1.15}
.gantt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 10px;min-width:640px}
.gantt .names{display:grid;grid-auto-rows:28px}
.gantt .names span{font:10.5px/28px var(--f-mono);color:var(--ink-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .area{position:relative;padding-bottom:22px}
.gantt .gr{position:relative;height:28px}
.gantt .gr i{position:absolute;top:5px;height:18px;min-width:3px}
.gantt .tk{position:absolute;top:0;bottom:22px;width:1px;background:var(--line)}
.gantt .tl{position:absolute;bottom:0;font:10.5px var(--f-mono);color:var(--ink-3);transform:translateX(-50%)}
.gantt .mk{position:absolute;top:0;bottom:22px;width:2px;background:var(--bad);border:0;padding:0;cursor:pointer}
/* responsive */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .s8,.s7,.s6,.s5,.s4{grid-column:span 12}
  .g84{grid-template-columns:minmax(0,1fr)}
  .hero,.sess-top{grid-template-columns:minmax(0,1fr)}
  .sess-d{justify-items:start}
  .cycle{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cstep:nth-child(4){border-left:0}
  .cstep:nth-child(n+4){border-top:1px solid var(--line)}
  .chint{grid-column:1 / -1;border-left:0}
  .t-top{grid-template-columns:minmax(0,1fr)}
  .t-price{text-align:left}
  .t-acts{justify-content:flex-start}
  .t-open{grid-template-columns:minmax(0,1fr)}
  .t-r{border-left:0;border-top:1px solid var(--line)}
  .jbtn{grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px}
  .jbtn .jl,.jbtn .jt{display:none}
  .jdet{padding-left:16px;grid-template-columns:96px minmax(0,1fr)}
  .tabs{margin-left:0}
}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cycle{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cstep:nth-child(4){border-left:1px solid var(--line)}
  .cstep:nth-child(odd){border-left:0}
  .cstep:nth-child(n+3){border-top:1px solid var(--line)}
  .ev{grid-template-columns:44px 12px minmax(0,1fr)}
  .ev .side{grid-column:3;text-align:left}
  .evr{grid-template-columns:minmax(0,1fr) auto}
  .evr .x{grid-column:1 / -1}
  .send{white-space:normal}
  .pulse,.pbtn{max-width:100%}
  .top{position:static}
  .pbtn{flex-wrap:wrap;text-align:left}
  .hright{margin-left:0}
  .jempty{grid-template-columns:minmax(0,1fr)}
  .frm{grid-template-columns:8px minmax(0,1fr) 64px 56px}
  .frm>:nth-child(4){display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

<body>

<main>
  <div id="boot" class="state">Загружаю датасет…</div>
  <section class="view" id="v-fix" role="tabpanel" aria-labelledby="tab-fix" hidden></section>
  <section class="view" id="v-overview" role="tabpanel" aria-labelledby="tab-overview" hidden></section>

  <section class="view" id="v-skills" role="tabpanel" aria-labelledby="tab-skills" hidden></section>
</main>

<script>
(function(){
"use strict";
// ---------- state ----------
// README пакета v5.1, «State Management». Вид, сессия и строка ленты — в адресе (#fix, #s/<id>/L<n>), остальное здесь.
const st={view:null,sid:null,line:null,flag:null,scrollTopic:null,days:7,agent:"all",proj:"all",kind:"work",
  step:"topics",open:null,moreTopics:false,discuss:null,toolsAll:false,tl:"main",tlFrom:0,titleOpen:false,openJ:null,pulseOpen:false};
let D=null,END=0,META={},JOURNAL=null,STATUS=null,SILENT=false;
const DETAIL={},OPEN=new Set(),PREV={},PREVSTEP={},SIG={};
let SEENJ=null,FLASH=new Set(),ENTERJ=new Set();
const PULSE={on:false,slots:Array.from({length:60},()=>({cl:0,cx:0})),active:[],err:"",slot:0,seen:{}};
const DAY=864e5,NNBSP=" ",EASE="cubic-bezier(.2,0,0,1)";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(a,f)=>a.reduce((x,y)=>x+(f(y)||0),0);
const T=s=>s?new Date(s).getTime():NaN;
const pad=n=>String(n).padStart(2,"0");
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const LIVE=()=>!!(D&&D.variant==="live");
function plural(n,one,few,many){const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?many:b>1&&b<5?few:b===1?one:many}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};

// ---------- values (README «Общие правила значений») ----------
const fmtN=n=>n==null||isNaN(n)?"—":Math.round(n).toLocaleString("ru-RU").replace(/\s/g,NNBSP);
const fmt$=v=>v==null||isNaN(v)?"—":v>=100?"$"+fmtN(v):"$"+v.toFixed(2);
// «≈» — оценка по прайсу; без знака — цифра, которую прислал сам агент (OTel Claude Code).
const est$=(v,basis)=>v==null||isNaN(v)?"—":(basis==="otel_reported"?"":"≈ ")+fmt$(v);
const costTitle=s=>s.cost_usd==null?"стоимость не записана":s.cost_basis==="otel_reported"?"по данным OTel Claude Code":"оценка по условной цене API";
const fmtD=m=>{if(m==null||isNaN(m))return "—";const r=Math.round(m);return r>=60?Math.floor(r/60)+" ч "+(r%60)+" м":r+" м"};
const fmtOpen=m=>m!=null&&m>=1440?"23 ч+":fmtD(m);
const pct=v=>v==null||isNaN(v)||!isFinite(v)?"—":(v*100).toFixed(1).replace(".",",")+"%";
const sec=v=>v==null?"—":v<10?v.toFixed(1).replace(".",","):String(Math.round(v));
const dec1=v=>v.toFixed(1).replace(".",",");
const short=id=>{const s=String(id||"");return s.length<=12?s:s.slice(0,8)+"…"+s.slice(-4)};
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const utc=t=>{const d=new Date(t);return isNaN(d)?"":d.toISOString().replace("T"," ").slice(0,16)+" UTC"};
// местное время; сегодня — «14:22», раньше — «30.09 14:22»; UTC — в title
function when(iso){if(!iso)return {text:"—",title:""};const d=new Date(iso);if(isNaN(d))return {text:"—",title:""};
  const same=d.toDateString()===new Date().toDateString();return {text:same?hhmm(d):pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+hhmm(d),title:utc(d)}}
const tm=(iso,cls)=>{const w=when(iso);return `<span${cls?` class="${cls}"`:""} title="${esc(w.title)}">${esc(w.text)}</span>`};
const ddmm=iso=>iso?iso.slice(8,10)+"."+iso.slice(5,7):"—";
const dmLocal=t=>{const d=new Date(t);return isNaN(d)?"—":pad(d.getDate())+"."+pad(d.getMonth()+1)};
function ago(iso){const m=(Date.now()-T(iso))/6e4;if(isNaN(m))return "—";if(m<1)return "только что";if(m<60)return `${Math.round(m)} мин назад`;if(m<1440)return `${Math.round(m/60)} ч назад`;return when(iso).text}
const idBtn=id=>`<button class="idc" data-copyid="${esc(id)}" title="Скопировать полный ID">${esc(short(id))}</button>`;
const lref=n=>(LIVE()?"#":"L")+n;
const lineBtn=(sid,line,label)=>line==null?"":`<button class="link mono" data-sid="${esc(sid)}" data-line="${esc(line)}">${esc(label||lref(line))}</button>`;
const agTag=(a,shortName)=>`<span class="tag ${a==="claude"?"claude":"codex"}">${a==="claude"?(shortName?"CC":"Claude Code"):(shortName?"CX":"Codex")}</span>`;
const sevCls=s=>s==="bad"?"bad":s==="warn"?"warn":"info";

const OUTCOME={verified:["подтверждён","ok"],partial:["частично","warn"],failed:["не достигнут","bad"],unknown:["неизвестно",""]};
const CHECK={suspected:["подозрение","warn"],confirmed:["подтверждено","bad"],checked_clear:["проверено · чисто","ok"],insufficient_data:["мало данных",""],not_checked:["не проверено",""],not_applicable:["не относится",""]};
const READY={hypothesis:"гипотеза",needs_spec:"нужна спецификация",prepared:"готово к применению"};
const DECISION={not_requested:"не запрошено",accepted:"принято",rejected:"отклонено",rework:"на доработке"};
const EXEC={not_applied:"не применено",applied:"применено"};
const EFFECT={not_measured:"не измерен",helped:"помогло",no_effect:"без эффекта",worse:"стало хуже",little_data:"мало данных"};
const KIND={personalization:"персонализация",project_rule:"правило проекта",skill:"skill",hook:"проверка · hook",script:"скрипт",automation:"автоматизация",diagnostic:"диагностика",habit:"привычка"};
const KINDS={user:["ваша","ok"],system:["служебная","muted"],automation:["расписание","acc"]};
const LAYER_RU={experience:"Опыт",instructions:"Инструкции",skill:"Skill",technical:"Техника"};
const SRC_TITLE={live:"Hooks hottell и нативный OTel из ClickHouse локального стенда, пересборка каждые 5 минут",deep:"Сырые журналы Codex, Deep 2.0 и 13 проверок · :8800"};
const tagOf=(map,k)=>{const v=map[k];return v?`<span class="tag ${v[1]}">${v[0]}</span>`:`<span class="tag">${esc(k||"—")}</span>`};
const checkName=id=>{const c=(D.checks_catalog||[]).find(x=>x.id===id);return c?c.name:""};
const FRI=()=>{const m={};(D.friction||[]).forEach(f=>m[f.key]=f);return m};

// ---------- sample: одна база на странице (README «База подсчётов») ----------
const kindOf=s=>s.kind||"user";
function inPeriod(s,days,offset){if(!days)return true;const to=END-offset*DAY,from=to-days*DAY;return T(s.end||s.start)>from&&T(s.start)<=to}
const periodText=()=>st.days?`за ${st.days} ${plural(st.days,"день","дня","дней")}`:"за всё время";
const inScope=(s,offset)=>inPeriod(s,st.days,offset)&&(st.agent==="all"||s.agent===st.agent)&&(st.proj==="all"||s.project===st.proj);
// S — сессии выборки: «Без служебных» скрывает только kind=system; U — ваши, A — по расписанию.
function sample(offset=0){
  const all=(D.sessions||[]).filter(s=>inScope(s,offset)),S=all.filter(s=>st.kind==="all"||kindOf(s)!=="system");
  return {S,all,ids:idsOf(S),U:S.filter(s=>kindOf(s)==="user"),A:S.filter(s=>kindOf(s)==="automation"),
    sys:all.filter(s=>kindOf(s)==="system").length,hiddenSys:st.kind==="work"?all.filter(s=>kindOf(s)==="system").length:0};
}
const idsOf=S=>new Set(S.map(s=>s.id));
const touches=(ids,list)=>(list||[]).some(x=>ids.has(x));
const allSelected=X=>X.S.length===(D.sessions||[]).length;
// Сумма поля строки по выбранным сессиям; без счёта по сессиям при неполной выборке — null.
function bySess(row,X,key){
  if(allSelected(X))return row[key]??null;
  if(!row.by_session)return null;
  let v=0;for(const [sid,x] of Object.entries(row.by_session))if(X.ids.has(sid)){const y=typeof x==="number"?x:x[key];if(y==null)return null;v+=y}
  return v;
}
function periodDays(S){const out=[];const e=new Date(END),base=Date.UTC(e.getUTCFullYear(),e.getUTCMonth(),e.getUTCDate());
  let n=st.days;if(!n){const first=Math.min(...S.map(s=>T(s.start)).filter(x=>!isNaN(x)),END),f=new Date(first);n=Math.max(1,Math.round((base-Date.UTC(f.getUTCFullYear(),f.getUTCMonth(),f.getUTCDate()))/DAY)+1)}
  for(let i=n-1;i>=0;i--)out.push(new Date(base-i*DAY).toISOString().slice(0,10));return out}

// ---------- friction and topics (план T34, шаг 1) ----------
// Сигнал в выборке: сессии, полный ли охват, эпизоды (null — счёта по сессиям нет). Доказательства для счёта
// не годятся — в данных они обрезаны до 60.
function frIn(f,ids){const all=f.sessions||[],ss=all.filter(x=>ids.has(x)),full=ss.length===all.length;
  const eps=!ss.length?0:full?(f.count??null):f.by_session?ss.reduce((n,x)=>n+(f.by_session[x]||0),0):null;
  return {ss,full,eps}}
const scopeOf=f=>f.scope==="collection"||(!f.scope&&f.kind==="diagnostic"&&f.source==="detector")?"collection":"work";
// тема и её сигнал — по pattern_id (не по совпадению названия)
const signalOf=f=>f.pattern_id?(D.friction||[]).find(r=>r.key===f.pattern_id)||null:null;
function topicEps(f,ids){const r=signalOf(f);if(r)return {...frIn(r,ids),sig:r,counted:true};
  const all=f.sessions||[],ss=all.filter(x=>ids.has(x)),bs=f.impact_by_session;
  return {ss,full:ss.length===all.length,eps:bs?ss.reduce((n,x)=>n+(bs[x]||0),0):null,sig:null,counted:!!bs}}
const hiddenSet=()=>new Set(lsGet("hottell.hidden")||[]);
const SEVR={bad:0,warn:1,info:2};
function topicsOf(X){const h=hiddenSet();
  return (D.findings||[]).filter(f=>scopeOf(f)==="work"&&touches(X.ids,f.sessions)&&!h.has(f.id))
    .map(f=>({f,...topicEps(f,X.ids)})).sort((a,b)=>(SEVR[a.f.sev]??3)-(SEVR[b.f.sev]??3)||(b.eps??-1)-(a.eps??-1))}
const topicForSignal=(key,X)=>topicsOf(X).find(t=>t.sig&&t.sig.key===key)||null;
// Эффект карточки здоровья — по выбранным сессиям, если есть счёт по сессиям.
function impactFor(f,ids){const all=f.sessions||[],sel=all.filter(x=>ids.has(x));
  if(!f.impact_by_session||sel.length===all.length)return f.impact||null;
  const v=sel.reduce((n,sid)=>n+(f.impact_by_session[sid]||0),0);
  return {value:`${fmtN(v)} ${f.impact_unit||""}`.trim(),label:`${f.impact?f.impact.label:""} · в выбранных`}}

// ---------- coach ----------

const isApplied=j=>j.decision==="applied"||j.decision==="test";
function journalTag(j){
  if(j.decision==="declined"||j.decision==="not_justified")return ["не внедряли","muted"];
  if(j.result==="not_repeated")return [`повтора не было на ${j.observations??"—"} ${plural(j.observations||0,"задаче","задачах","задачах")}`,"ok"];

// Числа, которые досчитывают от старого значения к новому (KPI, шаги цикла).
const FMT={};

function gapsBlock(id,extra,sid){

  else{const gen=all.filter(g=>!per.test(g)),n=all.length-gen.length;items=[...extra,...gen,...(n?[`Ещё ${n} ${plural(n,"замечание","замечания","замечаний")} по отдельным сессиям — в ленте каждой сессии.`]:[])]}
  return `<details class="box" data-keep="${id}"${OPEN.has(id)?" open":""}><summary>Ограничения данных · ${sid&&items.length===1&&/отдельных замечаний нет/.test(items[0])?0:items.length}</summary><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`}
function coverageLine(S){

}

// ---------- «Обзор» ----------
function renderOverview(){
  const X=sample(),{S,U,A,ids}=X,P=st.days?sample(st.days):null;
  const NA=S.filter(s=>kindOf(s)!=="automation");
  const userMin=NA.some(s=>s.user_min!=null)?sum(NA,s=>s.user_min):null,agentMin=NA.some(s=>s.active_min!=null)?sum(NA,s=>s.active_min):null,autoMin=sum(A,s=>s.active_min);
  const kc=S.filter(s=>s.cost_usd!=null),costV=kc.length?sum(kc,s=>s.cost_usd):null;
  const tokS=S.filter(s=>s.tok&&s.tok.input),tin=sum(tokS,s=>s.tok.input),tc=sum(tokS,s=>s.tok.cached);
  const calls=sum(S,s=>s.calls),errs=sum(S,s=>s.errors);
  const knownOf=SS=>SS.some(s=>s.outcome_known!=null)?sum(SS,s=>s.outcome_known):sum(SS,s=>(s.calls||0)-(s.unknown_results||0));
  const known=knownOf(S);
  // Изменение к прошлому периоду — только если оба значения известны.
  const delta=(cur,prev,goodDown)=>{if(!P||!P.S.length||cur==null||prev==null||!prev)return null;const ch=(cur-prev)/prev*100;
    if(Math.abs(ch)<2)return ["≈ как в прошлом периоде",""];const bad=goodDown?ch>0:ch<0;return [`${ch>0?"▲":"▼"} ${Math.abs(ch).toFixed(0)}% к прошлым ${st.days} дн`,bad?"bad":"ok"]};
  const pv=f=>P&&P.S.length?f(P):null;
  const autoNote=autoMin>=60?`${Math.round(autoMin/60)} ч`:`${Math.round(autoMin)} м`;
  const sessNote=[A.length?`ещё ${A.length} по расписанию`:"",st.kind==="work"?(X.hiddenSys?`${X.hiddenSys} служебных скрыто`:""):(X.sys?`${X.sys} служебных`:"")].filter(Boolean).join(" · ");
  const prevErr=pv(p=>{const k=knownOf(p.S);return k?sum(p.S,s=>s.errors)/k:null});
  const prevCost=pv(p=>p.S.every(s=>s.cost_usd!=null)?sum(p.S,s=>s.cost_usd):null);
  // Подпись остаётся всегда (она называет расписание, служебные, «у N из M»); изменение к прошлому периоду — второй строкой.
  const kpi=(key,l,v,f,sub,d,title)=>`<div class="kpi"${title?` title="${esc(title)}"`:""}><span class="l">${l}</span><span class="v">${num(key,v,f)}</span><span class="d">${esc(sub)}</span>${d?`<span class="d ${d[1]}">${esc(d[0])}</span>`:""}</div>`;
  const kpis=`<div class="kpis">${
    kpi("k:user","Ваше время",userMin,fmtD,"паузы «ответ → реплика» ≤ 30 мин",delta(userMin,pv(p=>sum(p.S.filter(s=>kindOf(s)!=="automation"),s=>s.user_min)),true))+
    kpi("k:agent","Агент работал",agentMin,fmtD,autoMin?`ещё ${autoNote} — по расписанию`:"сумма длительностей ходов",delta(agentMin,pv(p=>sum(p.S.filter(s=>kindOf(s)!=="automation"),s=>s.active_min)),false))+
    kpi("k:sess","Ваши сессии",U.length,fmtN,sessNote||"без расписания и служебных",delta(U.length,pv(p=>p.U.length),false))+
    kpi("k:cost","Расходы",costV,v=>"≈ "+fmt$(v),kc.length<S.length?`у ${kc.length} из ${S.length} сессий`:"наблюдаемая оценка",kc.length===S.length?delta(costV,prevCost,true):null,"Claude Code — по данным OTel, Codex — оценка по условной цене API; фактически — подписки")+
    kpi("k:cache","Попадание в кэш",tin?tc/tin:null,pct,`по ${tokS.length} ${plural(tokS.length,"сессии","сессиям","сессиям")} с токенами`,null)+
    kpi("k:err","Ошибки инструментов",known?errs/known:null,pct,`среди вызовов с известным исходом (${calls?pct(known/calls):"—"})`,delta(known?errs/known:null,prevErr,true))
  }</div>`;
  // Расходы и время по дням

function niceStep(m){const raw=m/4||1;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

// ---------- animation (README «Анимация: живой процесс») ----------
function afterRender(root){
  root.querySelectorAll(".cnt").forEach(el=>{const k=el.dataset.k,v=el.dataset.v===""?null:+el.dataset.v,p=PREV[k];PREV[k]=v;
    if(p==null||v==null||p===v||reduced()||document.visibilityState==="hidden")return; // в скрытой вкладке кадров нет — сразу новое значение
    const f=FMT[k],t0=performance.now();el.textContent=f(p); // счёт начинается со старого значения, без мигания нового
    const step=t=>{if(!el.isConnected)return;const q=Math.min(1,(t-t0)/600),e=1-Math.pow(1-q,3),x=p+(v-p)*e;el.textContent=f(Number.isInteger(p)&&Number.isInteger(v)&&q<1?Math.round(x):x);if(q<1)requestAnimationFrame(step)};
    requestAnimationFrame(step)});
}
// Если число шага цикла выросло после пересборки — точка проходит от предыдущего шага к нему.
function cycleDot(vals){
  const grew=SILENT?vals.findIndex(([k,v],i)=>i>0&&v!=null&&PREVSTEP[k]!=null&&v>PREVSTEP[k]):-1;
  vals.forEach(([k,v])=>PREVSTEP[k]=v);
  if(grew<1||reduced())return;
  const box=$("cycle"),dot=$("cdot"),steps=box.querySelectorAll(".cstep"),a=steps[grew-1],b=steps[grew];
  if(!a||!b||!dot.animate)return;
  const bx=box.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  const x0=ra.left+ra.width/2-bx.left,x1=rb.left+rb.width/2-bx.left,y=rb.top+rb.height/2-bx.top-bx.height/2;
  dot.animate([{transform:`translate(${x0}px,${y}px)`,opacity:1},{transform:`translate(${x1}px,${y}px)`,opacity:1},{transform:`translate(${x1}px,${y}px)`,opacity:0}],{duration:800,easing:EASE});
}

  const v=$("versions");if(!META.name&&!(META.links||[]).length){v.hidden=true;return}
  const cur=LIVE()?"live":"deep",other=cur==="live"?"deep":"live";
  v.hidden=false;v.innerHTML=(META.name?`<span class="cur" title="${esc(SRC_TITLE[cur])}">${esc(META.name)}</span>`:"")+(META.links||[]).map(l=>`<a href="${esc(l.url)}" title="${esc(SRC_TITLE[other])}">${esc(l.label)}</a>`).join("");
}
function sendLine(){
  const el=$("send"),x=STATUS;
  if(!x||!["ok","problem","not_configured"].includes(x.state)){el.hidden=true;return}
  const s=x.status||{},o=x.service_origin,a=(p,t)=>o?`<a href="${esc(o+p)}" target="_blank" rel="noopener">${t}</a>`:t;
  let h;
  if(x.state==="ok"){const q=(s.queue||{}).queued,v=(s.settings||{}).version,ls=(s.token||{}).last_sent;
    h=`<b class="ok">Отправка: работает</b>${ls?` · последняя ${esc(ago(ls))}`:""}${q!=null?` · в очереди ${fmtN(q)}`:""}${v!=null?` · настройки v${esc(v)}`:""} · ${a("/telemetry","Что отправлять →")}`}
  else if(x.state==="problem")h=`<b class="warn">Отправка: ошибка</b>${(s.problems||[])[0]?` · ${esc(s.problems[0])}`:""} · ${a("/connect","Подключение →")}`;
  else h=`<span class="muted" title="${esc(x.reason||"")}">Отправка не настроена · ${a("/connect","Подключение →")}</span>`;
  el.innerHTML=h;el.hidden=false;
}
// 60 столбиков по 10 с, последний — текущий интервал.
function pulseSlots(bars){const now=Math.floor(Date.now()/1e4)*1e4,sl=Array.from({length:60},()=>({cl:0,cx:0}));
  for(const b of bars||[]){const i=59-Math.round((now-T(b.t))/1e4);if(i>=0&&i<60)sl[i][b.agent==="claude"?"cl":"cx"]+=b.n||0}
  return {now,sl}}
function renderPulse(shift,ring){
  const el=$("pulse");if(!PULSE.on){el.hidden=true;return}
  const sl=PULSE.slots,z=b=>b.cl+b.cx===0,silent=PULSE.err||sl.slice(-12).every(z);
  let trail=0;for(let i=sl.length-1;i>=0&&z(sl[i]);i--)trail++;
  const bh=n=>Math.min(16,Math.round(n/12*16));
  const bars=sl.map(b=>`<span><i style="height:${z(b)?1:bh(b.cx)}px;background:${z(b)||silent?"var(--line)":"var(--ok)"}"></i><i style="height:${bh(b.cl)}px;background:${silent?"var(--line)":"var(--accent)"}"></i></span>`).join("");
  const perMin=sum(sl.slice(-6),b=>b.cl+b.cx),n=PULSE.active.length;
  const label=PULSE.err?"пульс недоступен":silent?(trail>=60?"тишина 10+ мин":`тишина ${Math.max(2,Math.round(trail*10/60))} мин`):`${n} ${plural(n,"работает","работают","работают")} · ${fmtN(perMin)} ${plural(perMin,"событие","события","событий")}/мин`;
  const drop=st.pulseOpen?`<div class="pdrop"><div class="h">Идут сейчас · ${n}</div>${PULSE.active.map(a=>{const known=(D&&D.sessions||[]).some(s=>s.id===a.sid);return `<div class="a"><div class="r1"><span style="font-weight:500">${esc(a.project||"без проекта")}</span><span class="mono muted" style="font-size:12px">${fmtN(a.per_min)} ${plural(a.per_min||0,"событие","события","событий")} за минуту</span></div><span class="f" title="${esc(a.first||"")}">${esc(a.first||"первая реплика ещё не в датасете")}</span>${known?`<button class="link" style="justify-self:start;font-size:12.5px" data-sid="${esc(a.sid)}">лента →</button>`:`<span class="muted" style="font-size:12px">лента — после пересборки</span>`}</div>`}).join("")||`<div class="none">Сейчас никто не работает.</div>`}</div>`:"";
  el.hidden=false;
  el.innerHTML=`<button class="pbtn" data-pulse="1" title="${esc(PULSE.err||"События хуков за 10 минут, столбик — 10 секунд")}" aria-expanded="${st.pulseOpen}"><span class="pbox"><span class="pbars">${bars}</span></span><span class="pdot${silent?" off":""}"><i class="ring"></i><i></i></span><span class="plabel">${esc(label)}</span></button>${drop}`;
  if(reduced())return;
  const pb=el.querySelector(".pbars");if(shift&&pb.animate)pb.animate([{transform:"translateX(3px)"},{transform:"translateX(0)"}],{duration:400,easing:EASE});
  if(ring)[el.querySelector(".ring"),$("live-ring")].forEach(r=>r&&r.animate&&r.animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.6)",opacity:0}],{duration:600,easing:EASE}));
}

// ---------- data: polling (скрытая вкладка не опрашивает) ----------
async function pollPulse(){
  try{const r=await fetch("/api/pulse",{cache:"no-store"});if(r.status===404){PULSE.on=false;renderPulse();return}
    const p=await r.json();const {now,sl}=pulseSlots(p.bars);
    const seen={};let ring=false;for(const b of p.bars||[]){const k=b.t+"|"+b.agent;seen[k]=b.n;if(PULSE.slot&&b.n>(PULSE.seen[k]||0))ring=true}
    const shift=PULSE.slot&&now!==PULSE.slot;
    Object.assign(PULSE,{on:true,slots:sl,active:p.active||[],err:p.error||"",slot:now,seen});
    renderPulse(shift,ring);
    if(st.view==="session"&&$("tl-live")){const s=(D.sessions||[]).find(x=>x.id===st.sid);if(s)$("tl-live").innerHTML=isLiveSession(s,DETAIL[s.id])?`<span class="livebadge"><span class="pdot"><i class="ring" id="live-ring"></i><i></i></span>идёт сейчас</span>`:""}
  }catch(_){}
}
async function pollStatus(){try{const r=await fetch("/api/status",{cache:"no-store"});STATUS=r.ok?await r.json():null}catch(_){STATUS=null}sendLine()}
async function pollJournal(){
  let j;try{const r=await fetch("/api/coach/journal",{cache:"no-store"});j=r.ok?(await r.json()).entries||[]:r.status===404?[]:undefined}catch(_){}
  if(j===undefined){if(JOURNAL===null)JOURNAL=[];return} // сбой чтения — журнал не обнуляем
  const next=j,ids=new Set(next.map(x=>x.id));
  const changed=JSON.stringify(next)!==JSON.stringify(JOURNAL||[]);
  ENTERJ=SEENJ?new Set([...ids].filter(x=>!SEENJ.has(x))):new Set();
  SEENJ=ids;JOURNAL=next;
  if(changed&&D&&st.view==="fix"){SILENT=true;renderFix();SILENT=false}
  ENTERJ=new Set();
}
// true — пришла новая сборка, false — та же; ошибка — исключение.
async function fetchDataset(){
  const r=await fetch("/api/dataset",{cache:"no-store"}),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
  if(!D||j.generated_at===D.generated_at)return false;applyDataset(j);return true;
}
const pollDataset=()=>fetchDataset().catch(()=>false);
// Тихое обновление: новые данные подменяются на месте; изменившиеся карточки тем вспыхивают, открытая лента дописывается снизу.
function applyDataset(j){
  const old={};(D.findings||[]).forEach(f=>old[f.id]=topicSig(f));
  setData(j);
  FLASH=new Set((D.findings||[]).filter(f=>old[f.id]&&old[f.id]!==topicSig(f)).map(f=>f.id));
  const sid=st.view==="session"?st.sid:null;
  for(const k in DETAIL)if(k!==sid)delete DETAIL[k];
  SILENT=true;
  if(sid&&DETAIL[sid]){const s=(D.sessions||[]).find(x=>x.id===sid);fetchDetail(sid).then(X=>{if(st.view==="session"&&st.sid===sid&&s&&$("tl"))renderTimeline(s,X,false,true)}).catch(()=>{})}
  else render();
  SILENT=false;FLASH=new Set();
}
function setData(j){
  D=j;END=T(D.window&&D.window.to)||Date.now();
  (D.sessions||[]).forEach(s=>{if(!s.project)s.project="без проекта"});
  const projects=[...new Set((D.sessions||[]).map(s=>s.project))].sort();
  if(st.proj!=="all"&&!projects.includes(st.proj))st.proj="all";
  $("proj").innerHTML=`<option value="all">Все проекты</option>`+projects.map(p=>`<option value="${esc(p)}"${p===st.proj?" selected":""}>${esc(p)}</option>`).join("");
  $("kind-seg").hidden=!(D.sessions||[]).some(s=>s.kind==="system");
  renderVersions();
}
let TICK=0;
function poll(all){
  if(document.visibilityState==="hidden")return;
  if(PULSE.on)pollPulse();
  if(all||++TICK%12===0){if(META.refresh_s>0)pollDataset();pollJournal();pollStatus()}
}

// ---------- navigation ----------
const VIEWS={fix:renderFix,overview:renderOverview,sessions:renderSessions,session:renderSession,friction:renderFriction,tools:renderTools,skills:renderSkills};
function parseHash(){
  const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^s\/([0-9a-f-]{36})(?:\/L(\d+))?$/);
  if(m)return {view:"session",sid:m[1],line:m[2]?+m[2]:null};
  const f=h.match(/^sessions\/(\w+)$/);if(f)return {view:"sessions",flag:f[1]};
  return {view:VIEWS[h]&&h!=="session"?h:null};
}
function go(hash){if(location.hash==="#"+hash)route();else location.hash=hash}
function route(){
  const r=parseHash(),prevSid=st.sid;st.view=r.view||"fix";st.sid=r.sid||null;st.line=r.line??null;st.flag=r.flag||null;st.pulseOpen=false;
  if(st.sid!==prevSid){st.titleOpen=false;st.tlFrom=0;if(st.discuss&&String(st.discuss.key).startsWith("sess:"))st.discuss=null}
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+st.view);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===(st.view==="session"?"sessions":st.view))));
  render();renderPulse();
  const tp=st.scrollTopic&&st.view==="fix"&&$("topic-"+st.scrollTopic);st.scrollTopic=null;
  if(tp)tp.scrollIntoView({block:"start"});else if(st.line==null)window.scrollTo({top:0});
}
function render(){if(D)VIEWS[st.view]()}
function setSeg(attr,val){document.querySelectorAll(`[data-${attr}]`).forEach(x=>{if(x.closest(".seg"))x.setAttribute("aria-pressed",String(x.dataset[attr]===String(val)))})}
function flashLabel(btn,text){const was=btn.dataset.label||btn.textContent;btn.dataset.label=was;btn.textContent=text;clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.textContent=was},1600)}
function copy(text){try{return navigator.clipboard.writeText(text).then(()=>true,()=>false)}catch(_){return Promise.resolve(false)}}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
$("proj").addEventListener("change",e=>{st.proj=e.target.value;render()});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.keep){d.open?OPEN.add(d.dataset.keep):OPEN.delete(d.dataset.keep)}},true);
document.addEventListener("click",e=>{
  const t=e.target,c=s=>t.closest(s);let el;
  if(st.pulseOpen&&!c("#pulse")){st.pulseOpen=false;renderPulse()}
  if(el=c("[data-days]")){st.days=+el.dataset.days;setSeg("days",st.days);render();return}
  if(el=c("[data-discuss]")){discuss(el);return}
  if(el=c("[data-agent]")){st.agent=el.dataset.agent;setSeg("agent",st.agent);render();return}
  if(el=c("[data-kind]")){st.kind=el.dataset.kind;setSeg("kind",st.kind);render();return}
  if(el=c("[data-pulse]")){st.pulseOpen=!st.pulseOpen;renderPulse();return}
  if(el=c("[data-copyid]")){copy(el.dataset.copyid).then(ok=>flashLabel(el,ok?"ID скопирован":"Не удалось"));return}
  if(el=c("[data-copytext]")){copy(el.dataset.copytext).then(ok=>flashLabel(el,ok?"Скопировано":"Выделите и скопируйте"));return}
  if(c("[data-discuss-close]")){st.discuss=null;patchSlots();return}
  if(el=c("[data-step]")){const k=el.dataset.step;st.step=k;if(["sessions","signals","topics"].includes(k))st.moreTopics=true;renderFix();return}
  if(el=c("[data-topic]")){const id=el.dataset.topic;st.open=st.open===id?null:id;renderFix();return}
  if(c("[data-moretopics]")){st.moreTopics=!st.moreTopics;renderFix();return}
  if(el=c("[data-opentopic]")){st.open=st.scrollTopic=el.dataset.opentopic;st.moreTopics=true;go("fix");return}
  if(el=c("[data-hide]")){const s=hiddenSet();s.add(el.dataset.hide);lsSet("hottell.hidden",[...s]);render();return}
  if(c("[data-restore]")){lsSet("hottell.hidden",[]);render();return}
  if(el=c("[data-openj]")){const id=el.dataset.openj;st.openJ=st.openJ===id?null:id;renderFix();return}
  if(c("[data-toolsall]")){st.toolsAll=!st.toolsAll;renderTools();return}
  if(c("[data-titletoggle]")){st.titleOpen=!st.titleOpen;const h=document.querySelector("#v-session .sess-h h1");if(h)h.classList.toggle("clamp",!st.titleOpen);c("[data-titletoggle]").textContent=st.titleOpen?"свернуть":"полностью";return}
  if(el=c("[data-tl]")){st.tl=el.dataset.tl;st.line=null;st.tlFrom=0;const s=(D.sessions||[]).find(x=>x.id===st.sid);if(s&&DETAIL[s.id])renderTimeline(s,DETAIL[s.id]);return}
  if(el=c("[data-tlshift]")){st.tlFrom=Math.max(0,+el.dataset.tlshift);const s=(D.sessions||[]).find(x=>x.id===st.sid);if(s&&DETAIL[s.id])renderTimeline(s,DETAIL[s.id],true);return}
  if(el=c("[data-tlbottom]")){const b=$("tl");b.scrollTop=b.scrollHeight;el.remove();return}
  if(el=c("[data-sid]")){const l=el.dataset.line;go("s/"+el.dataset.sid+(l?"/L"+l:""));return}
  if(el=c("[data-flag]")){go("sessions/"+el.dataset.flag);return}
  if(el=c("[data-go]")){go(el.dataset.go)}
});
function discuss(el){const d={key:el.dataset.discuss,agent:el.dataset.agent,subject:el.dataset.subject,ok:false};st.discuss=d;
  patchSlots();copy(coachReply(d.agent,d.subject)).then(ok=>{d.ok=ok;if(st.discuss===d)patchSlots()})}
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const el=document.activeElement;if(el&&el.tagName==="TR"&&(el.dataset.sid||el.dataset.flag))el.click()}if(e.key==="Escape"&&st.pulseOpen){st.pulseOpen=false;renderPulse()}});
document.addEventListener("scroll",e=>{const b=e.target;if(b&&b.id==="tl"&&b.scrollHeight-b.scrollTop-b.clientHeight<24){const p=b.querySelector(".newev");if(p)p.remove()}},true);
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll(true)});
window.addEventListener("focus",()=>{if(D)pollJournal()});
// «Обновить»: пересборка (если сервер умеет), затем датасет; подпись возвращается через 2,2 с.
$("refresh").addEventListener("click",async()=>{
  const b=$("refresh");if(b.disabled)return;b.disabled=true;b.textContent="Обновляю…";let label;
  try{if(META.rebuild){const r=await fetch("/api/rebuild",{method:"POST"});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||r.status)}}
    label=await fetchDataset()?"Обновить":"Без изменений";pollJournal();pollStatus()}catch(_){label="Не удалось"}
  b.textContent=label;b.disabled=false;if(label!=="Обновить")setTimeout(()=>{b.textContent="Обновить"},2200);
});

async function load(){
  const r=await fetch("/api/dataset",{cache:"no-store"});const j=await r.json();
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
  setData(j);$("boot").hidden=true;route();
}
(async()=>{
  try{META=await fetch("/api/meta").then(r=>r.json())}catch(_){META={}}
  PULSE.on=!!META.pulse;
  await Promise.all([pollJournal(),pollStatus()]);
  try{await load()}catch(e){$("boot").innerHTML=`<b>Датасет недоступен.</b> ${esc(e.message)}<br><pre class="snip">python3 ui/builder/build.py</pre>`;return}
  if(META.pulse)pollPulse();
  setInterval(()=>poll(),5000);
})();
})();
</script>
