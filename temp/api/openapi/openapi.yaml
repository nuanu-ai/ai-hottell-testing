openapi: 3.0.3
info:
  title: harness-telemetry API
  version: 0.1.0
servers:
  - url: /api
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: Open without a session. Opens a session and sets its cookie.
      parameters:
        - name: User-Agent
          in: header
          required: false
          description: Kept with the session to tell the signed-in browsers apart
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          description: invalid_credentials — wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /auth/passkey/login/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Begin signing in with a passkey
      description: >-
        Open without a session. No email is asked: any discoverable passkey of a user
        answers. Sets the ht_webauthn cookie of the ceremony, which lives 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginPasskeyLoginRequest"
      responses:
        "200":
          description: The options for navigator.credentials.get
          headers:
            Set-Cookie:
              $ref: "#/components/headers/WebAuthnCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        default:
          $ref: "#/components/responses/Error"
  /auth/passkey/login/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish signing in with a passkey
      description: >-
        Open without a session. Verifies the answer of the browser against the ceremony
        of the ht_webauthn cookie, opens a session, sets its cookie and deletes ht_webauthn.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/WebAuthnCeremony"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredentialRequest"
      responses:
        "204":
          description: Signed in; Set-Cookie carries ht_session and the deleted ht_webauthn
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/PasskeyCeremonyFailed"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Closes the session of the request and deletes its cookie.
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user of the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the password of the signed-in user
      description: Needs the current password; closes every other session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: wrong_current_password, password_too_short or password_too_long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: The passkeys of the signed-in user
      responses:
        "200":
          description: The passkeys, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Begin adding a passkey to the signed-in user
      description: Sets the ht_webauthn cookie of the ceremony, which lives 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginPasskeyRegistrationRequest"
      responses:
        "200":
          description: The options for navigator.credentials.create
          headers:
            Set-Cookie:
              $ref: "#/components/headers/WebAuthnCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "400":
          description: invalid_passkey_name — the name is not 1–64 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish adding a passkey to the signed-in user
      description: >-
        Verifies the answer of the browser against the ceremony of the ht_webauthn cookie,
        stores the passkey under the name given at the begin and deletes ht_webauthn.
      parameters:
        - $ref: "#/components/parameters/WebAuthnCeremony"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredentialRequest"
      responses:
        "201":
          description: The passkey added; Set-Cookie carries the deleted ht_webauthn
          headers:
            Set-Cookie:
              $ref: "#/components/headers/WebAuthnCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyItem"
        "400":
          $ref: "#/components/responses/PasskeyCeremonyFailed"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMyPasskey
      summary: Delete a passkey of the signed-in user
      description: The password stays, so the user can still sign in.
      responses:
        "204":
          description: Passkey deleted
        "404":
          description: passkey_not_found — no such passkey of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/keys:
    get:
      operationId: getMyKeys
      summary: The state of the MCP key and the collector token of the signed-in user
      responses:
        "200":
          description: Whether each key is active, when it was created and last used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeysStatus"
        default:
          $ref: "#/components/responses/Error"
  /me/keys/mcp:
    post:
      operationId: issueMyMcpKey
      summary: Issue the MCP key of the signed-in user
      description: >-
        Issues a new MCP key and revokes the one the user had. Its open value is answered
        once: only its hash is kept.
      responses:
        "201":
          description: The open value of the key and where to connect the agent with it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedMcpKey"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeMyMcpKey
      summary: Revoke the MCP key of the signed-in user
      responses:
        "204":
          description: Key revoked
        "404":
          description: access_key_not_found — the user has no active MCP key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/keys/ingest/reissue:
    post:
      operationId: reissueMyIngestToken
      summary: Reissue the collector token of the signed-in user
      description: >-
        Issues a new collector token and revokes the one the user had: sending stops on
        every machine until the binary gets the new token through MCP. The open value is
        not answered here; only the binary gets it, through MCP.
      responses:
        "204":
          description: Token reissued
        default:
          $ref: "#/components/responses/Error"
  /me/telemetry-settings:
    get:
      operationId: getMyTelemetrySettings
      summary: The deny settings of the signed-in user and their version
      description: >-
        The settings in full form, every field with its default included; the defaults and
        version 0 when the user has never saved settings.
      responses:
        "200":
          description: The settings and their version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionedTelemetrySettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMyTelemetrySettings
      summary: Save the deny settings of the signed-in user in place of the version they were read at
      description: >-
        Saves settings in place of expectedVersion and tells the MCP subscribers of the user.
        An absent field takes its default. Settings equal to the stored ones keep the version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTelemetrySettingsRequest"
      responses:
        "200":
          description: The saved settings in full form and their new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionedTelemetrySettings"
        "409":
          description: settings_version_conflict — the settings are no longer at expectedVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: invalid_telemetry_settings — the settings break the schema; detail tells where and why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTelemetrySettingsError"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: Every user, invited ones included
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: inviteUser
      summary: Invite a user
      description: Creates an invited user and a one-time invitation link that lives 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: The invited user and the invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUserResponse"
        "400":
          description: invalid_email or invalid_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: email_taken — another user has the email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: revokeInvite
      summary: Revoke the invitation
      description: Deletes the invited user together with the invitation link.
      responses:
        "204":
          description: Invitation revoked
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: user_not_invited — the user has accepted the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/invite:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: reissueInvite
      summary: Reissue the invitation link
      description: Issues a new invitation link; the previous one stops working.
      responses:
        "200":
          description: The new invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: user_not_invited — the user has accepted the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: issuePasswordReset
      summary: Issue a password reset link to another active user
      description: Issues a one-time reset link that lives 7 days; the previous unused one stops working.
      responses:
        "200":
          description: The reset link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetLink"
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: user_not_active — the invitation is not accepted; cannot_reset_self — the own password is changed in the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /invites/{token}:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    get:
      operationId: getInvite
      summary: The user an invitation link was issued to
      description: Open without a session.
      responses:
        "200":
          description: The invited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkHolder"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /invites/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    post:
      operationId: acceptInvite
      summary: Accept the invitation by setting a password
      description: Open without a session. Uses the link up, signs the user in and sets the session cookie.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Invitation accepted, signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          description: password_too_short or password_too_long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /password-resets/{token}:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    get:
      operationId: getPasswordReset
      summary: The user a password reset link was issued to
      description: Open without a session.
      responses:
        "200":
          description: The user whose password the link resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkHolder"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /password-resets/{token}/complete:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    post:
      operationId: completePasswordReset
      summary: Set a new password by the reset link
      description: >-
        Open without a session. Uses the link up, closes every session of the user,
        signs the user in and sets the session cookie.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Password set, signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          description: password_too_short or password_too_long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /version:
    get:
      operationId: getVersion
      summary: Service build version
      responses:
        "200":
          description: The version the service was built with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkToken:
      name: token
      in: path
      required: true
      description: The token of a one-time link; never written to logs
      schema:
        type: string
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: Kept with the session to tell the signed-in browsers apart
      schema:
        type: string
    WebAuthnCeremony:
      name: ht_webauthn
      in: cookie
      required: false
      description: The ceremony begun by the matching begin operation; without it the answer is passkey_ceremony_expired
      schema:
        type: string
  headers:
    WebAuthnCookie:
      description: The ht_webauthn cookie of a WebAuthn ceremony, HttpOnly, SameSite=Strict and Path=/api; set on begin, deleted on finish
      schema:
        type: string
    SessionCookie:
      description: The ht_session cookie, HttpOnly and SameSite=Lax; set on sign-in, cleared on sign-out
      schema:
        type: string
  responses:
    PasskeyCeremonyFailed:
      description: >-
        passkey_verification_failed — the answer of the browser does not verify;
        passkey_ceremony_expired — no ceremony, or it expired or was finished already
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LinkNotFound:
      description: link_not_found — no such link
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LinkGone:
      description: link_used or link_expired — the link cannot be used any more
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Any 4xx or 5xx answer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    BeginPasskeyLoginRequest:
      type: object
    BeginPasskeyRegistrationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: The publicKey member of the options the browser passes to the authenticator
    PasskeyCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential of the browser, serialized to JSON
    PasskeyItem:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyItem"
    KeyStatus:
      type: object
      required: [active, createdAt, lastUsedAt]
      properties:
        active:
          type: boolean
          description: The user has an active key of this kind
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the active key was created; null when there is none
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When the active key was last used, recorded at most once a minute; null until it is used or when there is none
    KeysStatus:
      type: object
      required: [mcp, ingest]
      properties:
        mcp:
          $ref: "#/components/schemas/KeyStatus"
        ingest:
          $ref: "#/components/schemas/KeyStatus"
    IssuedMcpKey:
      type: object
      required: [key, mcpUrl, serverName]
      properties:
        key:
          type: string
          description: The open value of the MCP key; shown once and never answered again
        mcpUrl:
          type: string
          description: The address of the MCP server, <HT_PUBLIC_ORIGIN>/mcp
        serverName:
          type: string
          description: The name the MCP server is added to the agent under, hottell
    VersionedTelemetrySettings:
      type: object
      required: [settings, version]
      properties:
        settings:
          $ref: "#/components/schemas/TelemetrySettings"
        version:
          type: integer
          format: int64
          minimum: 0
          description: The version of the settings, kept by the server; 0 before the first save
    UpdateTelemetrySettingsRequest:
      type: object
      required: [settings, expectedVersion]
      properties:
        settings:
          $ref: "#/components/schemas/TelemetrySettings"
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: The version the settings were read at
    InvalidTelemetrySettingsError:
      type: object
      required: [code, message, detail]
      properties:
        code:
          type: string
          description: invalid_telemetry_settings
        message:
          type: string
          description: Human-readable description
        detail:
          type: string
          description: Where in the settings and why they break the schema, e.g. agents.claude.hook_events.denied[0] unknown hook event
    TelemetrySettings:
      description: >-
        The deny settings document of a user, as docs/specs/hottell-contract/settings.schema.json
        describes it. An absent field takes its default: everything is sent, history is not
        backfilled. The server checks the document itself, so the handler takes it as is.
      type: object
      additionalProperties: false
      # The generated package imports encoding/json already.
      x-go-type: json.RawMessage
      properties:
        version:
          type: integer
          minimum: 0
          default: 0
          description: The version of the settings; kept by the server, never set by the client
        agents:
          type: object
          additionalProperties: false
          properties:
            claude:
              $ref: "#/components/schemas/ClaudeTelemetrySettings"
            codex:
              $ref: "#/components/schemas/CodexTelemetrySettings"
        folders:
          $ref: "#/components/schemas/FolderRules"
        backfill_history:
          type: boolean
          default: false
          description: Kind 7 "backfill history"
    ClaudeTelemetrySettings:
      type: object
      description: What is denied of Claude Code
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
          description: Kind 1 "agent"; false turns the agent off entirely
        sources:
          $ref: "#/components/schemas/TelemetrySources"
        hook_events:
          type: object
          description: Kind 3 "hook event"; the denied hook_event_name of the agent
          additionalProperties: false
          properties:
            denied:
              type: array
              uniqueItems: true
              default: []
              items:
                $ref: "#/components/schemas/ClaudeHookEvent"
        hook_fields:
          $ref: "#/components/schemas/DeniedHookFields"
        native_content:
          $ref: "#/components/schemas/DeniedNativeContent"
    CodexTelemetrySettings:
      type: object
      description: What is denied of Codex CLI
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
          description: Kind 1 "agent"; false turns the agent off entirely
        sources:
          $ref: "#/components/schemas/TelemetrySources"
        hook_events:
          type: object
          description: Kind 3 "hook event"; the denied hook_event_name of the agent
          additionalProperties: false
          properties:
            denied:
              type: array
              uniqueItems: true
              default: []
              items:
                $ref: "#/components/schemas/CodexHookEvent"
        hook_fields:
          $ref: "#/components/schemas/DeniedHookFields"
        native_content:
          $ref: "#/components/schemas/DeniedNativeContent"
    TelemetrySources:
      type: object
      description: Kind 2 "source"; false turns a source off
      additionalProperties: false
      properties:
        hooks:
          type: boolean
          default: true
        transcripts:
          type: boolean
          default: true
        native_metrics:
          type: boolean
          default: true
        native_logs:
          type: boolean
          default: true
        native_traces:
          type: boolean
          default: true
    DeniedHookFields:
      type: object
      description: Kind 4 "hook event field"; the denied top-level fields
      additionalProperties: false
      properties:
        denied:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/HookField"
    DeniedNativeContent:
      type: object
      description: Kind 6 "native OTel content category"
      additionalProperties: false
      properties:
        denied:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/NativeContentCategory"
    FolderRules:
      type: object
      description: Kind 5 "project folder", shared by both agents
      additionalProperties: false
      properties:
        denied:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/FolderPattern"
        allowed:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/FolderPattern"
    ClaudeHookEvent:
