    HookField:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      not:
        enum: [session_id, hook_event_name, cwd]
      description: A top-level field name; the service fields session_id, hook_event_name and cwd cannot be denied
    NativeContentCategory:
      type: string
      enum: [prompts, assistant_responses, tool_details, tool_content, raw_api_bodies]
    FolderPattern:
      type: string
      pattern: "^(/|~/)"
      description: A path pattern starting with / or ~/; ** matches any number of segments
    UserListItem:
      type: object
      required: [id, email, name, status, createdAt, lastLoginAt, inviteExpiresAt, isMe]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [invited, active]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiry of the unused invitation, past or not; null for an active user
        isMe:
          type: boolean
          description: The user is the signed-in one
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"
    InviteUserRequest:
