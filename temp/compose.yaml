# Local development only: the credentials below are not secrets.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ht
      POSTGRES_USER: ht
      POSTGRES_PASSWORD: ht
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ht -d ht"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Applies pending migrations and exits; app waits for it to succeed.
  migrate:
    build: &app-build
      context: .
      dockerfile: deployments/Dockerfile
    image: harness-telemetry:dev
    entrypoint: ["/cli"]
    command: ["migrate", "up"]
    environment:
      HT_DATABASE_URL: &database-url postgres://ht:ht@postgres:5432/ht?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # No healthcheck: the distroless image has no shell or curl to run one.
  app:
    build: *app-build
    image: harness-telemetry:dev
    environment:
      HT_DATABASE_URL: *database-url
      HT_COLLECTOR_URL: http://collector:4318
      # /install.sh and /download/* come from the Gitea release; values from the shell or .env,
      # empty falls back to the service defaults. The token is never written here.
      HT_GITEA_URL: ${HT_GITEA_URL:-}
      HT_GITEA_REPO: ${HT_GITEA_REPO:-}
      HT_GITEA_TOKEN: ${HT_GITEA_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      collector:
        condition: service_started

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ht
      CLICKHOUSE_PASSWORD: ht
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ht --password ht -q 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Receives OTLP on host ports 14317 (gRPC) and 14318 (HTTP) and writes to ClickHouse.
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  pgdata:
  chdata:
