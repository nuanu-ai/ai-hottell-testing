version: 3
workdir: .

# web/node_modules ships stray .go files of npm packages.
exclude:
  - web/node_modules

allow:
  # Vendors are listed so that a library can be confined to its adapter: every project
  # package may use commonVendors, the rest only where deps grants them with canUse.
  depOnAnyVendor: false
  # domain, application and pkg have no code yet; HT-3 fills them.
  ignoreNotFoundComponents: true
  # Only imports are checked: deep scan reports every interface injection, which is
  # exactly how the composition root wires adapters into ports.
  deepScan: false

vendors:
  uuid: { in: github.com/google/uuid }
  pgx: { in: [github.com/jackc/pgx/v5, github.com/jackc/pgx/v5/**] }
  goose: { in: [github.com/pressly/goose/v3, github.com/pressly/goose/v3/**] }
  testcontainers: { in: [github.com/testcontainers/testcontainers-go, github.com/testcontainers/testcontainers-go/**] }
  x-crypto: { in: [golang.org/x/crypto, golang.org/x/crypto/**] }
  gomock: { in: [go.uber.org/mock, go.uber.org/mock/**] }
  # Everything specific to go-webauthn stays in the WebAuthn adapter.
  go-webauthn: { in: [github.com/go-webauthn/webauthn, github.com/go-webauthn/webauthn/**] }
  # The runtime of the generated server stays in the generated openapi package.
  oapi-runtime: { in: [github.com/oapi-codegen/runtime, github.com/oapi-codegen/runtime/**] }
  # The TOML parser reads the Codex config in the hottell binary's mcpconfig only.
  go-toml: { in: [github.com/pelletier/go-toml/v2, github.com/pelletier/go-toml/v2/**] }
  # The MCP SDK stays in the MCP server of the service, the hottell binary's MCP client and
  # its local MCP server hottell-local.
  go-sdk: { in: [github.com/modelcontextprotocol/go-sdk, github.com/modelcontextprotocol/go-sdk/**] }
  # The OTLP proto and the protobuf runtime stay in the hottell binary's otlp package and in
  # the ingest of the service.
  otlp-proto: { in: [go.opentelemetry.io/proto/otlp, go.opentelemetry.io/proto/otlp/**] }
  protobuf: { in: [google.golang.org/protobuf, google.golang.org/protobuf/**] }
  # zstd unpacks the compressed Codex rollouts in the hottell binary's Codex transcript reader
  # and in the sessions hottell-local reads.
  zstd: { in: [github.com/klauspost/compress/zstd, github.com/klauspost/compress/zstd/**] }

commonVendors: [uuid, pgx, goose, testcontainers, x-crypto, gomock]

components:
  domain: { in: internal/domain/** }
  application: { in: internal/application/** }
  adapters: { in: internal/adapters/** }
  # The more specific glob wins for the adapter's own imports, so it may use go-webauthn
  # and not the other adapters; its importers still see it as part of adapters.
  webauthn: { in: internal/adapters/webauthn/** }
  # delivery lists its packages instead of internal/delivery/**: an overlapping glob
  # would let delivery import anything under it, generated openapi included.
  delivery: { in: [internal/delivery, internal/delivery/http, internal/delivery/http/handler/**, internal/delivery/http/middleware/**, internal/delivery/http/spa/**] }
  # The ingest is the only package of the service that may use the OTLP proto.
  ingest: { in: internal/delivery/http/ingest/** }
  openapi: { in: internal/delivery/http/openapi/** }
  # The MCP server is the only package that may use go-sdk.
  mcp: { in: internal/delivery/mcp/** }
  config: { in: internal/config/** }
  migrations: { in: database/migrations/** }
  ioc: { in: cmd/api/ioc/** }
  cmd: { in: [cmd/api, cmd/cli/**] }
  # The hottell binary runs on the user's Mac and is not part of the service.
  hottell: { in: internal/hottell/** }
  # The more specific glob lets the package that reads the agents' MCP configs use go-toml.
  hottellmcpconfig: { in: internal/hottell/mcpconfig/** }
  # The more specific glob lets the package that encodes OTLP logs use the OTLP proto.
  hottellotlp: { in: internal/hottell/otlp/** }
  # The more specific glob lets the Codex transcript reader use zstd.
  hottellcodextranscript: { in: internal/hottell/transcript/codex/** }
  # The more specific glob lets the binary's MCP client use go-sdk.
  hottellmcpclient: { in: internal/hottell/mcpclient/** }
  # hottell-local reads this Mac's transcripts, the dashboard's findings and the coach's
  # journal; the more specific glob lets its session reader unpack Codex rollouts with zstd.
  hottelllocal: { in: internal/hottell/local/** }
  # The more specific glob lets the local MCP server use go-sdk.
  hottellmcplocal: { in: internal/hottell/local/mcpserver/** }
  hottellcmd: { in: cmd/hottell/** }
  pkg: { in: pkg/** }
  # web embeds the built frontend; cmd/api hands it to the composition root.
  web: { in: web }
  # The root package holds only the module doc comment.
  root: { in: . }

deps:
  domain:
    mayDependOn: [domain, pkg]
  application:
    mayDependOn: [application, domain, pkg]
  adapters:
    mayDependOn: [adapters, domain, application, migrations, pkg]
  webauthn:
    mayDependOn: [webauthn, domain, application, pkg]
    canUse: [go-webauthn]
  delivery:
    mayDependOn: [delivery, domain, application, openapi, pkg]
  openapi:
    mayDependOn: [openapi]
    canUse: [oapi-runtime]
  mcp:
    mayDependOn: [mcp, domain, pkg]
    canUse: [go-sdk]
  ingest:
    mayDependOn: [ingest, domain, pkg]
    canUse: [otlp-proto, protobuf]
  config:
    mayDependOn: [config, pkg]
  migrations:
    mayDependOn: [migrations]
  # The composition root: the only place that imports concrete adapters.
  # cmd/api creates the database pool before the container is built (HT-6).
  ioc:
    mayDependOn: [ioc, domain, application, adapters, delivery, openapi, mcp, ingest, config, pkg]
  cmd:
    mayDependOn: [cmd, ioc, domain, application, adapters, config, migrations, pkg, web]
  # Vendors of the binary (go-sdk, TOML, OTLP proto) are granted here with canUse
  # by the tasks that bring them.
  hottell:
    mayDependOn: [hottell, hottellmcpconfig, hottellotlp, pkg]
  hottellmcpconfig:
    mayDependOn: [hottellmcpconfig, pkg]
    canUse: [go-toml]
  hottellotlp:
    mayDependOn: [hottellotlp, hottell, pkg]
    canUse: [otlp-proto, protobuf]
  hottellcodextranscript:
    mayDependOn: [hottellcodextranscript, hottell, pkg]
    canUse: [zstd]
  hottellmcpclient:
    mayDependOn: [hottellmcpclient, hottell, hottellmcpconfig, pkg]
    canUse: [go-sdk]
  hottelllocal:
    mayDependOn: [hottelllocal, pkg]
    canUse: [zstd]
  hottellmcplocal:
    mayDependOn: [hottellmcplocal, hottelllocal, pkg]
    canUse: [go-sdk]
  # The daemon holds the MCP subscription and reads the Codex transcripts.
  hottellcmd:
    mayDependOn: [hottellcmd, hottell, hottellmcpconfig, hottellotlp, hottellmcpclient, hottellcodextranscript, hottelllocal, hottellmcplocal, pkg]
  pkg:
    mayDependOn: [pkg]
  web:
    mayDependOn: [web]
  root:
    mayDependOn: [root]
