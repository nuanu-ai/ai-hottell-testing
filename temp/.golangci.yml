version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - git.alva.dev/alva/harness-telemetry

linters:
  default: standard
  enable:
    # errors: handled, wrapped with %w, compared with errors.Is/As
    - errorlint
    - nilerr
    - errname
    # context: first parameter, never stored, propagated
    - containedctx
    - contextcheck
    - noctx
    # resources: bodies, rows and statements closed
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # no globals, init-time singletons or panics
    - gochecknoglobals
    - gochecknoinits
    - forbidigo
    # structured logging
    - sloglint
    # tests: external package, t.Parallel, helpers
    - testpackage
    - paralleltest
    - tparallel
    - thelper
    # general correctness and style
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return an error instead of panicking
    sloglint:
      kv-only: true
      context: scope
    testpackage:
      skip-regexp: _internal_test\.go
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: (mock|openapi)/
        linters:
          - gochecknoglobals
