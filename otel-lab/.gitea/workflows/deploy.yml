# .gitea/workflows/deploy.yml — положен диспетчером, править вручную незачем.
name: Доставка
on:
  push: {branches: [main]}
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Чтение коммита
        uses: actions/checkout@v4

      # Что собирать — отвечает диспетчер. Раньше список добывал сам раннер:
      # читал delivery.yml питоном. PyYAML на раннере не оказалось, файл не
      # прочитался вовсе, список вышел пустым — и шаг завершился словами
      # «собирать нечего» с кодом ноль. Прогон был зелёный, образов в реестре
      # не было, и всё падало пятью минутами позже на схождении: «not found»,
      # будто беда в реестре, а не в сборке (DEP-242).
      #
      # Корень не в PyYAML: delivery.yml трактовали два кода, Go в диспетчере
      # и python здесь, — и они разошлись. Теперь трактует один.
      #
      # Имена шагов постоянны: по ним диспетчер сопоставляет ступени прогона.
      # «Сборка образа» в единственном числе осталась именем ступени, хотя
      # образов может быть несколько.
      - name: Сборка образа
        shell: bash
        run: |
          # Сроки обязательны: без них молчащий диспетчер держит задание
          # раннера часами вместо того, чтобы честно упасть.
          code=$(curl -sS --connect-timeout 10 --max-time 60 -X POST "$DISPATCHER/v1/images" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}" \
            -o /tmp/images.txt -w '%{http_code}')
          if [ "$code" != "200" ]; then
            echo "диспетчер не назвал, что собирать (ответ $code):"
            cat /tmp/images.txt
            exit 1
          fi
          if [ ! -s /tmp/images.txt ]; then
            # Пустой список от диспетчера — ответ, а не незнание: он смотрел
            # и compose, и delivery.yml. Стек из одних чужих образов законен.
            echo "собирать нечего — стек из чужих образов"
            exit 0
          fi
          # Реестр пакетов платформы — сам Gitea. Фронты ставят оттуда
          # @alva/* и ждут доступ секретом BuildKit «npmrc»: слой с учётными
          # данными остался бы в образе навсегда, поэтому файлом его класть
          # нельзя. Чтение пакетов анонимное — проверено запросом к реестру, —
          # значит в .npmrc нужен только адрес, без тайны.
          #
          # Секрет передаётся ТОЛЬКО тем образам, которые его ждут: docker без
          # BuildKit на «--secret» падает, и передавать его всем значило бы
          # сломать сборку сорока стекам ради одного (DEP-238).
          owner="${GITHUB_REPOSITORY%%/*}"
          printf '@%s:registry=%s/api/packages/%s/npm/\n' "$owner" "$GITHUB_SERVER_URL" "$owner" > /tmp/npmrc
          # Приватные Go-модули живут в том же Gitea, но чтение репозиториев,
          # в отличие от пакетов, анонимным не бывает: demo-tool падал четыре
          # прогона подряд на «go mod download» — git ls-remote к hubkit без
          # доступа (DEP-326). Проект объявляет потребность в Dockerfile тем
          # же способом: «--mount=type=secret,id=netrc», GOPRIVATE у него свой.
          #
          # Учётка — не та, что для реестра: у REGISTRY_PASSWORD одно право
          # write:package, и git ему отказывает (проверено в DEP-244). Нужен
          # токен с правом read:repository — секрет GIT_READ_TOKEN, положенный
          # владельцу Gitea один раз на все репозитории (как REGISTRY_*), а не
          # копией в каждый; логин — учётка, на которой выпущен токен, по
          # умолчанию та же, что у реестра. Файл лежит на раннере с правами
          # 600 и в слой не попадает: BuildKit монтирует его на время команды.
          # Хостов в файле два. Go ходит за модулем по имени из его пути
          # (git.alva.dev/alva/hubkit) — это публичное имя Gitea, GIT_HOST,
          # задано ниже рядом с REGISTRY. Раннер же видит Gitea под внутренним
          # адресом (GITHUB_SERVER_URL, 192.168.…:3000), и запись только на
          # него Go не применяет: прогон 23 demo-tool упал с «could not read
          # Username for https://git.alva.dev» при уже переданном секрете.
          # Вторая строка — на адрес раннера — для модулей, названных им.
          host="${GITHUB_SERVER_URL#*://}"; host="${host%%/*}"
          login="${GIT_READ_USER:-$REGISTRY_USER}"
          rm -f /tmp/netrc
          if [ -n "$GIT_READ_TOKEN" ]; then
            (umask 077; {
              printf 'machine %s login %s password %s\n' "$GIT_HOST" "$login" "$GIT_READ_TOKEN"
              [ "$host" = "$GIT_HOST" ] || printf 'machine %s login %s password %s\n' "$host" "$login" "$GIT_READ_TOKEN"
            } > /tmp/netrc)
            chmod 600 /tmp/netrc
            # После шага файлу на раннере делать нечего — каким бы концом
            # шаг ни кончился.
            trap 'rm -f /tmp/netrc' EXIT
          fi
          tag="${GITHUB_SHA::7}"
          while IFS=$'\t' read -r name dockerfile context; do
            full="$REGISTRY/$GITHUB_REPOSITORY"
            [ "$name" = "-" ] || full="$full-$name"
            secret=""
            if grep -q "id=npmrc" "$dockerfile"; then
              secret="--secret id=npmrc,src=/tmp/npmrc"
              echo "   образ ждёт реестр пакетов — доступ передан секретом сборки"
            fi
            if grep -q "id=netrc" "$dockerfile"; then
              if [ ! -s /tmp/netrc ]; then
                # Отказ здесь и по имени: без доступа «go mod download» упадёт
                # минутой позже на «git ls-remote», и причину оттуда четыре
                # прогона подряд никто не вычитал.
                echo "образ ждёт доступ к приватным Go-модулям (id=netrc), а секрета GIT_READ_TOKEN нет ни у репозитория, ни у владельца: положите токен с правом read:repository (см. README общего вызова)"
                exit 1
              fi
              secret="$secret --secret id=netrc,src=/tmp/netrc"
              echo "   образ ждёт приватные Go-модули — доступ к git передан секретом сборки"
            fi
            echo "== $full:$tag (из $dockerfile, контекст $context)"
            docker build $secret -f "$dockerfile" -t "$full:$tag" "$context"
          done < /tmp/images.txt
        env:
          # Публичное имя Gitea — хост Go-модулей; раннер видит Gitea иначе.
          GIT_HOST: git.alva.dev
          REGISTRY: reg.alva.dev:5443
          DISPATCHER: https://deploy.alva.dev
          TOKEN: ${{ secrets.DISPATCHER_TOKEN }}
          # Доступ к приватным Go-модулям (DEP-326): токен владельца с правом
          # read:repository и учётка, на которой он выпущен (пусто — учётка
          # реестра). Секреты владельца Gitea подставляет всем его репозиториям.
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          GIT_READ_USER: ${{ secrets.GIT_READ_USER }}
          GIT_READ_TOKEN: ${{ secrets.GIT_READ_TOKEN }}

      # Отправка отдельным шагом, а не вместе со сборкой: так ступени прогона
      # различают «не собралось» и «собралось, но не уехало».
      - name: Отправка в реестр
        shell: bash
        run: |
          [ -s /tmp/images.txt ] || { echo "отправлять нечего"; exit 0; }
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          tag="${GITHUB_SHA::7}"
          while IFS=$'\t' read -r name dockerfile context; do
            full="$REGISTRY/$GITHUB_REPOSITORY"
            [ "$name" = "-" ] || full="$full-$name"
            docker push "$full:$tag"
          done < /tmp/images.txt
        env:
          REGISTRY: reg.alva.dev:5443
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      # Дальше всё делает диспетчер: секреты, compose, правила, раскатка,
      # схождение. Раннер сообщает «поехали» и ждёт ответа.
      - name: Вызов диспетчера
        shell: bash
        run: |
          # Сроки обязательны: без них молчащий диспетчер держит задание
          # раннера часами вместо того, чтобы честно упасть.
          answer=$(curl -sS --connect-timeout 10 --max-time 60 -X POST "$DISPATCHER/v1/run" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\",\"actions_run\":$GITHUB_RUN_ID,\"attempt\":$GITHUB_RUN_ATTEMPT}" \
            -w '\n%{http_code}')
          code=$(echo "$answer" | tail -1)
          echo "$answer" | sed '$d'
          # Отказ диспетчера обязан валить задание: молчаливо зелёный прогон,
          # после которого ничего не раскатилось, хуже красного.
          [ "$code" = "200" ] || exit 1
        env:
          DISPATCHER: https://deploy.alva.dev
          TOKEN: ${{ secrets.DISPATCHER_TOKEN }}
