# otel-lab — приёмник телеметрии агентов (Claude Code, Codex) на 5 дней.
# Два сервиса: OTel Collector (приём OTLP, редакция, запись) и ClickHouse (хранение, SQL по HTTP).
#
# Стек закреплён на swarm2: данные ClickHouse лежат на отдельном диске Ceph RBD
# (32 ГБ из ceph-nvme, scsi2 у VM 102, ext4 с меткой otel-lab, /var/lib/otel-lab,
# в fstab по UUID с nofail), не на CephFS — база на сетевой ФС уже роняла Gitea.
# swarm2 выбран как нода с самым свободным корнем (образы Docker ложатся туда);
# рядом стек monitoring — Grafana при желании читает ClickHouse без нового UI.
#
# Имена (заводятся при adopt / через панель доменов, оба приватные, LAN + VPN):
#   otel.alva.dev -> collector:4318   приём OTLP/HTTP от агентов (bearer-токен)
#   ch.alva.dev   -> clickhouse:8123  SQL по HTTP для забора (пользователь default, пароль из секрета)

services:
  collector:
    # Собственный образ: конфиг коллектора запечён в образ (Dockerfile в корне),
    # потому что configs/bind-файлов в стеках у нас нет, а env-конфиг нечитаем.
    image: reg.alva.dev:5443/alva/otel-lab:IMAGE_TAG
    secrets:
      - source: otel-lab_otel_lab_ingest_token_v1
        target: otel_lab_ingest_token
      - source: otel-lab_otel_lab_ch_password_v1
        target: otel_lab_ch_password
    networks: [inner, edge-net]
    # healthcheck не объявлен: образ без оболочки. Живость — health_check extension на :13133.
    # Экспортёр ClickHouse при старте требует живую базу и иначе завершает процесс.
    # Поэтому без failure_action: rollback — Swarm перезапускает коллектор с паузой,
    # пока ClickHouse не поднимется (прогон 244 упал именно на откате).
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == swarm2]
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, parallelism: 1}
      resources: {limits: {memory: 512M}}

  clickhouse:
    # LTS-ветка 25.8; тег фиксирован, обновление только коммитом.
    image: docker.io/clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: otel
      # Пользователь остаётся default, пароль — из файла секрета: entrypoint образа
      # понимает CLICKHOUSE_PASSWORD_FILE и переписывает users.d/default-user.xml,
      # так что безпарольного входа не остаётся. CLICKHOUSE_USER не задан намеренно.
      # 🔴 Знак доллара в этом файле недопустим нигде, даже удвоенный: диспетчер
      # раскрывает интерполяцию сам, и Portainer получает одинарный знак —
      # разбор compose падает (прогоны 239–241).
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/otel_lab_ch_password
      # default заводит пользователей: нужен readonly-пользователь reader для
      # забора через ch.alva.dev (создаётся один раз после первого старта).
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    secrets:
      - source: otel-lab_otel_lab_ch_password_v1
        target: otel_lab_ch_password
    volumes:
      - /var/lib/otel-lab/clickhouse:/var/lib/clickhouse
    networks: [inner, edge-net]
    healthcheck:
      # в образе нет wget/curl, зато есть bash: GET /ping без пароля через /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8123; printf 'GET /ping HTTP/1.0\\r\\n\\r\\n' >&3; grep -q Ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == swarm2]
      restart_policy: {condition: any}
      update_config: {order: stop-first, parallelism: 1}
      # ClickHouse по умолчанию считает, что ему можно 90% RAM хоста; лимит
      # контейнера он видит через cgroup и подстраивается, но запас нужен.
      resources: {limits: {memory: 2G}}

secrets:
  otel-lab_otel_lab_ingest_token_v1:
    external: true
  otel-lab_otel_lab_ch_password_v1:
    external: true

networks:
  inner:
    driver: overlay
  edge-net:
    external: true
