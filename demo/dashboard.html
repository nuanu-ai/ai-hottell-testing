<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дашборд AI Hottell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: IBM Carbon — UI shell header, line tabs, square tiles on a 16px grid; summary first, detail on click. */
:root {
  --bg: #f4f4f4; --layer: #ffffff; --layer-2: #f4f4f4; --layer-hover: #e8e8e8; --layer-accent: #e0e0e0; --selected: #e0e0e0;
  --border: #e0e0e0; --border-strong: #8d8d8d;
  --text: #161616; --text-2: #525252; --text-3: #6f6f6f; --on-color: #ffffff;
  --interactive: #0f62fe; --interactive-hover: #0050e6; --link: #0f62fe; --focus: #0f62fe;
  --shell: #161616; --shell-text: #f4f4f4; --shell-2: #c6c6c6; --shell-border: #393939;
  --error: #da1e28; --success: #24a148; --warning: #f1c21b; --caution: #ff832b; --flag-bg: #fff2e8;
  --tag-gray-bg: #e0e0e0; --tag-gray: #393939; --tag-blue-bg: #d0e2ff; --tag-blue: #0043ce;
  --tag-green-bg: #a7f0ba; --tag-green: #0e6027; --tag-red-bg: #ffd7d9; --tag-red: #a2191f;
  --tag-purple-bg: #e8daff; --tag-purple: #6929c4; --tag-orange-bg: #ffd9be; --tag-orange: #8a3800;
  --tag-yellow-bg: #fcf4d6; --tag-yellow: #684e00; --tag-teal-bg: #9ef0f0; --tag-teal: #005d5d;
  --c1: #6929c4; --c2: #1192e8; --c3: #005d5d; --c4: #9f1853;
  --font: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161616; --layer: #262626; --layer-2: #393939; --layer-hover: #333333; --layer-accent: #393939; --selected: #393939;
    --border: #393939; --border-strong: #6f6f6f;
    --text: #f4f4f4; --text-2: #c6c6c6; --text-3: #a8a8a8; --on-color: #ffffff;
    --interactive: #0f62fe; --interactive-hover: #0353e9; --link: #78a9ff; --focus: #ffffff;
    --shell: #161616; --shell-text: #f4f4f4; --shell-2: #c6c6c6; --shell-border: #393939;
    --error: #fa4d56; --success: #42be65; --warning: #f1c21b; --caution: #ff832b; --flag-bg: #3e1a00;
    --tag-gray-bg: #393939; --tag-gray: #c6c6c6; --tag-blue-bg: #002d9c; --tag-blue: #a6c8ff;
    --tag-green-bg: #044317; --tag-green: #6fdc8c; --tag-red-bg: #750e13; --tag-red: #ffb3b8;
    --tag-purple-bg: #491d8b; --tag-purple: #d4bbff; --tag-orange-bg: #5e2900; --tag-orange: #ffb784;
    --tag-yellow-bg: #483700; --tag-yellow: #fddc69; --tag-teal-bg: #004144; --tag-teal: #3ddbd9;
    --c1: #8a3ffc; --c2: #33b1ff; --c3: #08bdba; --c4: #ff7eb6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161616; --layer: #262626; --layer-2: #393939; --layer-hover: #333333; --layer-accent: #393939; --selected: #393939;
  --border: #393939; --border-strong: #6f6f6f;
  --text: #f4f4f4; --text-2: #c6c6c6; --text-3: #a8a8a8; --on-color: #ffffff;
  --interactive: #0f62fe; --interactive-hover: #0353e9; --link: #78a9ff; --focus: #ffffff;
  --shell: #161616; --shell-text: #f4f4f4; --shell-2: #c6c6c6; --shell-border: #393939;
  --error: #fa4d56; --success: #42be65; --warning: #f1c21b; --caution: #ff832b; --flag-bg: #3e1a00;
  --tag-gray-bg: #393939; --tag-gray: #c6c6c6; --tag-blue-bg: #002d9c; --tag-blue: #a6c8ff;
  --tag-green-bg: #044317; --tag-green: #6fdc8c; --tag-red-bg: #750e13; --tag-red: #ffb3b8;
  --tag-purple-bg: #491d8b; --tag-purple: #d4bbff; --tag-orange-bg: #5e2900; --tag-orange: #ffb784;
  --tag-yellow-bg: #483700; --tag-yellow: #fddc69; --tag-teal-bg: #004144; --tag-teal: #3ddbd9;
  --c1: #8a3ffc; --c2: #33b1ff; --c3: #08bdba; --c4: #ff7eb6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
svg { fill: currentColor; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 20px; letter-spacing: .16px;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .32px; }

/* UI shell */
.shell {
  background: var(--shell); color: var(--shell-text); border-bottom: 1px solid var(--shell-border);
  padding: env(safe-area-inset-top, 0px) 16px 0;
}
.shell-row { max-width: 1312px; margin: 0 auto; min-height: 48px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
.brand b { font-weight: 600; letter-spacing: .1px; }
.brand span { color: var(--shell-2); }
.shell-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px; }
.shell .demo-tag { border: 1px solid #8a3ffc; color: #d4bbff; border-radius: 24px; padding: 2px 10px; font-size: 12px; line-height: 16px; letter-spacing: .32px; }
.shell .period { color: var(--shell-2); font-size: 12px; letter-spacing: .32px; }

/* Tabs */
.tabs-wrap { background: var(--layer); border-bottom: 1px solid var(--border); padding-inline: 16px; overflow-x: auto; }
.tabs { max-width: 1312px; margin: 0 auto; display: flex; gap: 0; }
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid var(--border);
  padding: 12px 16px 10px; color: var(--text-2); cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center;
}
.tab:hover { color: var(--text); background: var(--layer-hover); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--interactive); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--tag-gray-bg); color: var(--tag-gray); font-size: 12px; line-height: 20px; text-align: center; font-weight: 400; }
.count.hot { background: var(--interactive); color: var(--on-color); }

/* Page */
main { padding: 24px 16px 48px; }
.page { max-width: 1312px; margin: 0 auto; display: grid; gap: 16px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 24px; }
h1 { font-size: 28px; line-height: 36px; font-weight: 400; margin: 0; letter-spacing: 0; }
h2 { font-size: 16px; line-height: 22px; font-weight: 600; margin: 0; letter-spacing: 0; }
h3 { font-size: 14px; line-height: 18px; font-weight: 600; margin: 0; letter-spacing: .16px; }
.summary { color: var(--text-2); }
.summary b { color: var(--text); font-weight: 600; }
.helper { color: var(--text-3); font-size: 12px; line-height: 16px; letter-spacing: .32px; }
.label { color: var(--text-2); font-size: 12px; line-height: 16px; letter-spacing: .32px; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-12 { grid-column: span 12; }
.span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; }
@media (max-width: 1055px) { .span-8, .span-4, .span-5, .span-7 { grid-column: span 12; } }

.tile { background: var(--layer); padding: 16px; min-width: 0; }
.tile-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }

/* Saved time */
.saved-number { font-size: 54px; line-height: 60px; font-weight: 300; letter-spacing: -.5px; margin: 4px 0 8px; }
.saved-number .approx { color: var(--text-3); margin-right: 6px; }
.split { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 16px; }
.split div { display: grid; gap: 2px; }
.split strong { font-size: 20px; line-height: 28px; font-weight: 400; }
.bar { display: flex; height: 16px; gap: 2px; margin-bottom: 12px; }
.bar i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 24px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.legend .sw { width: 12px; height: 12px; margin-top: 4px; }
.legend .mins { color: var(--text-2); white-space: nowrap; }
.legend .off { color: var(--text-3); }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.kv { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.kv div { display: grid; gap: 2px; min-width: 0; }
.kv strong { font-weight: 600; }

/* Structured list (inbox) */
.list { display: grid; }
.row-btn {
  appearance: none; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 16px; gap: 12px; align-items: center;
  padding: 14px 8px 14px 0; border-bottom: 1px solid var(--border);
}
.row-btn:hover { background: var(--layer-hover); }
.row-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.row-btn .dot.flag { background: var(--caution); }
.row-btn .n { font-size: 20px; line-height: 28px; font-weight: 400; }
.row-btn .n.zero { color: var(--text-3); }
.row-btn svg { fill: var(--text-2); }
.row-btn .t { display: grid; gap: 2px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--layer-accent); text-align: left; font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: .32px; padding: 12px 16px; white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--layer-hover); }
tr.sel td { background: var(--selected); }
td .sub { color: var(--text-2); font-size: 12px; line-height: 16px; letter-spacing: .32px; margin-top: 2px; }
.num { text-align: right; white-space: nowrap; }

/* Tags */
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 24px; font-size: 12px; line-height: 16px; letter-spacing: .32px; white-space: nowrap; background: var(--tag-gray-bg); color: var(--tag-gray); }
.tag.blue { background: var(--tag-blue-bg); color: var(--tag-blue); }
.tag.green { background: var(--tag-green-bg); color: var(--tag-green); }
.tag.red { background: var(--tag-red-bg); color: var(--tag-red); }
.tag.purple { background: var(--tag-purple-bg); color: var(--tag-purple); }
.tag.orange { background: var(--tag-orange-bg); color: var(--tag-orange); }
.tag.yellow { background: var(--tag-yellow-bg); color: var(--tag-yellow); }
.tag.teal { background: var(--tag-teal-bg); color: var(--tag-teal); }
.tag.outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); }
.tag.det { font-family: var(--mono); border-radius: 0; background: var(--text); color: var(--bg); }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }

/* Buttons */
.btn { appearance: none; border: 1px solid transparent; cursor: pointer; min-height: 32px; padding: 5px 15px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 18px; background: var(--interactive); color: var(--on-color); }
.btn:hover { background: var(--interactive-hover); }
.btn.ter { background: transparent; color: var(--link); border-color: var(--link); }
.btn.ter:hover { background: var(--interactive); color: var(--on-color); border-color: var(--interactive); }
.btn.ghost { background: transparent; color: var(--link); padding-inline: 8px; }
.btn.ghost:hover { background: var(--layer-hover); }
.btn.sec { background: var(--text-2); color: var(--bg); }
.btn.sec:hover { background: var(--text); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* Where bad */
.problem-title { font-weight: 600; }
.proposal-line { display: grid; gap: 6px; }
.proposal-line .arrow { color: var(--text-2); }

/* Sessions */
.agent { display: inline-flex; align-items: center; gap: 6px; }
.agent i { width: 8px; height: 8px; display: inline-block; }
.agent.codex i { background: var(--c2); }
.agent.claude i { background: var(--c4); }
.detail { display: grid; gap: 16px; align-content: start; }
.detail-head { display: grid; gap: 6px; }
.detail-head h2 { font-size: 20px; line-height: 28px; font-weight: 400; }
.flag-box { background: var(--flag-bg); border-left: 3px solid var(--caution); padding: 12px 16px; display: grid; gap: 10px; }
.flag-box .q { font-weight: 600; }
.basis { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.basis li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; }
.basis .ok { color: var(--success); }
.basis .no { color: var(--caution); }
.opinion { color: var(--text-2); font-size: 12px; line-height: 16px; letter-spacing: .32px; }

.turns { display: grid; }
.turn { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; }
.turn.ep-confirmed { border-left-color: var(--error); }
.turn.ep-pending { border-left: 3px dashed var(--caution); }
.turn .idx { color: var(--text-3); text-align: right; font-family: var(--mono); font-size: 12px; padding-top: 2px; }
.turn .body { display: grid; gap: 6px; min-width: 0; }
.human { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
.cls { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; font-size: 12px; letter-spacing: .32px; border: 1px solid currentColor; white-space: nowrap; }
.cls.task { color: var(--text-2); }
.cls.correction { color: var(--error); }
.cls.clarification { color: var(--caution); }
.cls.answer { color: var(--link); }
.cls.goal_change { color: var(--c1); }
.cls.ack { color: var(--text-3); }
.cls.low { border-style: dashed; }
.cls.filled { background: currentColor; }
.cls.filled span { color: var(--bg); }
.agent-say { color: var(--text-2); }
.agent-say code, .ep-note code { font-family: var(--mono); font-size: 12px; background: var(--layer-2); padding: 0 4px; }
.marks { display: flex; flex-wrap: wrap; gap: 6px; }
.ep { background: var(--layer-2); padding: 10px 12px; display: grid; gap: 8px; }
.ep-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ep-note { color: var(--text-2); }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1055px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 8px; align-content: start; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 2px solid var(--border-strong); }
.card { background: var(--layer); padding: 12px; display: grid; gap: 8px; border: 1px solid transparent; }
.card.flash { border-color: var(--interactive); }
.card .was { color: var(--text-2); font-size: 12px; line-height: 16px; letter-spacing: .32px; }
.card .should { font-size: 14px; }
.empty { color: var(--text-3); padding: 12px 0; }
.recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.rec { padding: 16px; gap: 10px; align-content: start; }
.rec-title { font-size: 20px; line-height: 28px; font-weight: 400; }
.change { margin: 0; background: var(--layer-2); border-left: 2px solid var(--interactive); padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }

.foot { color: var(--text-3); font-size: 12px; line-height: 16px; letter-spacing: .32px; }
.toast { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--bg); padding: 10px 16px; max-width: calc(100% - 32px); z-index: 10; }
select.inline { background: transparent; border: 0; border-bottom: 1px solid var(--border-strong); padding: 4px 24px 4px 8px; color: var(--text); }
select.inline option { background: var(--layer); color: var(--text); }
input.min { width: 72px; background: var(--layer); border: 0; border-bottom: 1px solid var(--border-strong); padding: 5px 8px; }
@media (prefers-reduced-motion: no-preference) { .card, .tab, .row-btn { transition: background-color .11s, border-color .11s; } }
</style>
</head>
<body>

<header class="shell">
  <div class="shell-row">
    <div class="brand"><b>AI Hottell</b><span>Анализ сессий</span></div>
    <div class="shell-right">
      <span class="period">16–29 сентября · 14 дней</span>
      <span class="demo-tag">Демо · условные данные</span>
    </div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs" role="tablist" aria-label="Экраны">
    <button class="tab" role="tab" id="tab-overview" data-tab="overview" aria-selected="true">Обзор <span class="count hot" id="c-overview"></span></button>
    <button class="tab" role="tab" id="tab-sessions" data-tab="sessions" aria-selected="false">Сессии</button>
    <button class="tab" role="tab" id="tab-proposals" data-tab="proposals" aria-selected="false">Рекомендации</button>
  </div>
</div>

<main>
  <section class="page" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
  <section class="page" id="view-sessions" role="tabpanel" aria-labelledby="tab-sessions" hidden></section>
  <section class="page" id="view-proposals" role="tabpanel" aria-labelledby="tab-proposals" hidden></section>
</main>

<div class="toast" id="toast" hidden></div>

      var r = byId(recs, d.apply); r.state = "applied";
      applied.unshift({ title: r.act.replace(/^(Добавьте|Создайте|Исправьте|Поставьте|Почистите)\s/, function (m) { return { "Добавьте ": "Добавлено: ", "Создайте ": "Создан ", "Исправьте ": "Исправлен ", "Поставьте ": "Поставлена ", "Почистите ": "Почищен " }[m] || m; }), date: "29 сен", usage: null, effect: null, human: 0, agent: 0, status: "check", color: "--c4", fresh: true });
      toast(r.done + " — следим за эффектом"); renderProposals(); renderCounts(); return;
    }
    if (d.copy) {
      var txt = byId(recs, d.copy).change;
      try { navigator.clipboard.writeText(txt).then(function () { toast("Скопировано"); }, function () { toast("Не удалось скопировать — выделите текст вручную"); }); } catch (e) { toast("Не удалось скопировать — выделите текст вручную"); }
      return;
    }
    if (d.rej) { byId(recs, d.rej).state = "rejected"; toast("Отклонено"); renderProposals(); renderCounts(); return; }
  });
  document.querySelector(".tabs").addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var order = ["overview", "sessions", "proposals"], i = order.indexOf(state.tab);
    i = (i + (ev.key === "ArrowRight" ? 1 : 2)) % 3; go(order[i]); $("#tab-" + order[i]).focus();
  });

  var h = (location.hash || "").replace("#", "");
  if (["overview", "sessions", "proposals"].indexOf(h) >= 0) state.tab = h;
  render();
})();
</script>
</body>
</html>
