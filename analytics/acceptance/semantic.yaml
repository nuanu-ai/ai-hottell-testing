# Приёмочные случаи для разборов моделью · draft 29.09.2026
# turn_classes, claims, instructions — быстрый разбор хода (analytics/quick-review.md, схема turn_review);
# остальные разделы — глубокий разбор, skill session-retro. Ожидаемые ответы — по схемам analytics/skill/schemas.json.
# Это исторический draft, не доказательство приёмки Deep 2.0. Шесть регрессий из
# docs/plan/hottell-2.0.md запускаются через analytics/v2_semantic_eval.py с
# приватным JSON-набором вне Git; прогон модели и его вердикты сохраняют отдельно.

turn_classes:
  # класс реплики человека (analytics/model.md §3.5)
  - id: S-TURN-1
    prompt: "Сверь возвраты по карточным платежам за август"
    previous_agent: "Собрал все возвраты за август: карты, переводы, кошельки — 214 записей."
    turn: "Нет, я же писал — только карточные"
    expect: correction
  - id: S-TURN-2
    prompt: "Сверь возвраты за август"
    previous_agent: "Собрал все возвраты за август — 214 записей."
    turn: "Возвраты только по карточным платежам"
    expect: clarification
  - id: S-TURN-3
    prompt: "Подготовь письмо партнёру о графике выплат"
    previous_agent: "С какой даты действует новый график?"
    turn: "С 1 октября"
    expect: answer
  - id: S-TURN-4
    prompt: "Сделай отчёт по возвратам в Markdown"
    previous_agent: "Отчёт в reports/refunds-08.md."
    turn: "Посмотрел — лучше давай таблицей для бухгалтерии"
    expect: goal_change
  - id: S-TURN-5
    prompt: "Сверь возвраты за август"
    previous_agent: "Сверка за август сошлась, отчёт в reports/refunds-08.md."
    turn: "Отлично. Теперь то же самое за сентябрь"
    expect: new_task
  - id: S-TURN-6
    prompt: "Обнови зависимости"
    previous_agent: "Обновлю 12 пакетов и прогоню тесты. Продолжать?"
    turn: "да, продолжай"
    expect: ack
  - id: S-TURN-7
    # короткое «ок» — правилом, без вызова модели
    prompt: "Сделай отчёт по возвратам"
    previous_agent: "Черновик готов, продолжать?"
    turn: "ок"
    expect: {class: ack, by: rule}

claims:
  # D05: заявление о завершении при неподтверждённом результате
  - id: S-CLAIM-1
    final_message: "Готово: отчёт сформирован и отправлен бухгалтерии."
    verdict: unknown
    note: "в сессии нет вызова отправки"
    expect: {claims_done: true, D05: true}
  - id: S-CLAIM-2
    final_message: "Сделал черновик отчёта, проверь цифры в строках 3–5 — не уверен в курсе."
    verdict: unknown
    expect: {claims_done: false, D05: false}
  - id: S-CLAIM-3
    final_message: "Всё готово, итоги сошлись."
    verdict: verified
    expect: {claims_done: true, D05: false}

instructions:
  # D10: одна и та же инструкция о способе работы в разных сессиях
  - id: S-INSTR-1
    a: "Сначала проверь статус платежа, потом считай"
    b: "Перед расчётом всегда смотри статус платежа"
    expect: same
  - id: S-INSTR-2
    a: "Сначала проверь статус платежа, потом считай"
    b: "Проверь статус тикета 4812"
    expect: different
  - id: S-INSTR-3
    a: "Не трогай файлы в папке finance/archive"
    b: "Сумма возврата — 1 250 евро"
    expect: {b_is_instruction: false}

skills:
  # D19 и D25
  - id: S-SKILL-1
    installed: [{name: refund-reconcile, description: "Сверка возвратов за месяц: выгрузка, статусы платежей, итог и отчёт для бухгалтерии"}]
    task: "Сверь возвраты за сентябрь"
    skill_used: false
    session_tokens: 240000
    class_median_with_skill: 90000
    expect: {D19: true}
  - id: S-SKILL-2
    installed: [{name: refund-reconcile, description: "Сверка возвратов за месяц: выгрузка, статусы платежей, итог и отчёт для бухгалтерии"}]
    task: "Сверь возвраты за сентябрь вручную, без skill — хочу посмотреть шаги"
    skill_used: false
    expect: {D19: false}
  - id: S-SKILL-3
    skill: refund-reconcile
    sessions:
      - {skill_used: true, confirmed_episodes_after_activation: [D03], verdict: partial}
      - {skill_used: true, confirmed_episodes_after_activation: [], verdict: failed}
    expect: {D25: true}

config:
  # D26
  - id: S-CONFIG-1
    item: {kind: agents_md, scope: project, path_class: "<project>/AGENTS.md", modified_at: "2026-06-10"}
    today: "2026-09-29"
    models_after_change: ["gpt-5.4-codex", "gpt-5.5-codex"]
    expect: {status: stale}
  - id: S-CONFIG-2
    item: {kind: skill, scope: global, path_class: "~/.codex/skills/invoice-parser", modified_at: "2026-09-01"}
    today: "2026-09-29"
    last_used: "2026-08-10"
    expect: {status: unused}
  - id: S-CONFIG-3
    item: {kind: agents_md, scope: global, path_class: "~/.codex/AGENTS.md", modified_at: "2026-09-20", rules: ["1. Отвечай кратко, без пояснений"]}
    human_turns_in_other_sessions: ["Распиши подробно, с пояснениями", "Пиши развёрнуто, мне нужны причины", "Подробнее, пожалуйста, с объяснением"]
    expect: {status: contradicted, rules_contradicted: [1]}

forgot:
  # D12 (b): агент забыл сказанное в этой же сессии
  - id: S-FORGOT-1
    turns:
      - {human: "Сверь возвраты за август, только карточные", agent: "Сверил 131 карточный возврат"}
      - {human: "Теперь сделай отчёт для бухгалтерии", agent: "Отчёт по всем 214 возвратам: карты, переводы, кошельки"}
    expect: {D12: true, evidence_turns: [0, 1]}
  - id: S-FORGOT-2
    turns:
      - {human: "Сверь возвраты за август, только карточные", agent: "Сверил 131 карточный возврат"}
      - {human: "Теперь добавь переводы тоже", agent: "Добавил переводы: всего 187 возвратов"}
    expect: {D12: false}

proposals:
  # предложения по одной сессии и по повторам (skill/SKILL.md, шаг 7)
  - id: S-PROP-1
    session_episodes: [{pattern: D24, status: confirmed, note: "MCP платежей отвечает 401, 4 вызова подряд"}]
    other_sessions_with_pattern: 0
    open_proposals: []
    expect: {proposal: true, basis: single_session, class: settings, confidence_max: 0.6}
  - id: S-PROP-2
    session_episodes: [{pattern: D03, status: dismissed, reason: "ожидание деплоя"}]
    other_sessions_with_pattern: 0
    open_proposals: []
    expect: {proposal: false}
  - id: S-PROP-3
    session_episodes: [{pattern: D01, status: confirmed, note: "коррекция во 2-й реплике: только карточные возвраты"}]
    other_sessions_with_pattern: 2
    open_proposals: []
    expect: {proposal: true, basis: repeated, sessions_count: 3, class: policy}
  - id: S-PROP-4
    session_episodes: [{pattern: D24, status: confirmed, note: "MCP платежей отвечает 401"}]
    other_sessions_with_pattern: 1
    open_proposals: [{pattern: D24, target: "MCP payments", status: proposed}]
    expect: {proposal: false, add_evidence_to_open: true}
