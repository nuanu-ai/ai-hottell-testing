# Приёмочные случаи для структурных детекторов · draft 29.09.2026
# Синтетические сессии в логической модели (analytics/model.md), без привязки к хранению.
# t — время от начала сессии, мм:сс. Реализация детектора принята, когда все случаи дают expect.
# Формат события:
#   human_turn: {t, type, turn, text}
#   agent_stop: {t, type, turn, final_message}
#   tool_call:  {t, type, id, tool, input, success, error?, output?}
#   compaction: {t, type, id}
#   permission: {t, type, call_id, decided_after_s, decision}

cases:

  - id: D03-P1
    detector: D03
    about: одна и та же проверка падает одинаково, файлы между попытками не меняются
    sessions:
      - session_id: s-d03-p1
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Почини расчёт итога в отчёте по возвратам"}
          - {t: "00:40", type: tool_call, id: c1, tool: Bash, input: {command: "pytest tests/test_refund.py"}, success: false, error: "FAILED tests/test_refund.py::test_total - AssertionError: 1200 != 1250"}
          - {t: "01:20", type: tool_call, id: c2, tool: Bash, input: {command: "pytest tests/test_refund.py"}, success: false, error: "FAILED tests/test_refund.py::test_total - AssertionError: 1200 != 1250"}
          - {t: "02:05", type: tool_call, id: c3, tool: Bash, input: {command: "pytest tests/test_refund.py"}, success: false, error: "FAILED tests/test_refund.py::test_total - AssertionError: 1200 != 1250"}
          - {t: "02:50", type: tool_call, id: c4, tool: Bash, input: {command: "pytest  tests/test_refund.py"}, success: false, error: "FAILED tests/test_refund.py::test_total - AssertionError: 1200 != 1250"}
          - {t: "03:30", type: agent_stop, turn: 1, final_message: "Тест падает, похоже на проблему округления."}
    expect:
      episodes:
        - {pattern: D03, evidence: [c1, c2, c3, c4], severity: medium}
    note: "c4 отличается лишним пробелом — после канонизации input_exact_hash тот же"

  - id: D03-N1
    detector: D03
    about: между повторами агент правит файл — прогресс есть
    sessions:
      - session_id: s-d03-n1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Почини расчёт итога"}
          - {t: "00:30", type: tool_call, id: c1, tool: Bash, input: {command: "pytest tests/test_refund.py"}, success: false, error: "AssertionError: 1200 != 1250"}
          - {t: "01:00", type: tool_call, id: c2, tool: Edit, input: {file_path: "refunds/total.py"}, success: true}
          - {t: "01:20", type: tool_call, id: c3, tool: Bash, input: {command: "pytest tests/test_refund.py"}, success: false, error: "AssertionError: 1200 != 1250"}
          - {t: "01:50", type: tool_call, id: c4, tool: Edit, input: {file_path: "refunds/total.py"}, success: true}
          - {t: "02:10", type: tool_call, id: c5, tool: Bash, input: {command: "pytest tests/test_refund.py"}, success: false, error: "AssertionError: 1200 != 1250"}
    expect:
      episodes: []

  - id: D03-N2
    detector: D03
    about: опрос статуса — ожидание, а не повтор
    sessions:
      - session_id: s-d03-n2
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Дождись окончания сборки и скажи результат"}
          - {t: "00:10", type: tool_call, id: c1, tool: Bash, input: {command: "gh run view 4812 --json status"}, success: true, output: "in_progress"}
          - {t: "01:10", type: tool_call, id: c2, tool: Bash, input: {command: "gh run view 4812 --json status"}, success: true, output: "in_progress"}
          - {t: "02:10", type: tool_call, id: c3, tool: Bash, input: {command: "gh run view 4812 --json status"}, success: true, output: "in_progress"}
          - {t: "03:10", type: tool_call, id: c4, tool: Bash, input: {command: "gh run view 4812 --json status"}, success: true, output: "completed"}
    expect:
      episodes: []

  - id: D03-N3
    detector: [D03, D07]
    about: лимит запросов, обработанный растущими паузами и закончившийся успехом
    sessions:
      - session_id: s-d03-n3
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Выгрузи возвраты за август"}
          - {t: "00:05", type: tool_call, id: c1, tool: Bash, input: {command: "curl -s https://api.example.test/refunds?month=08"}, success: false, error: "HTTP 429 Too Many Requests"}
          - {t: "00:07", type: tool_call, id: c2, tool: Bash, input: {command: "curl -s https://api.example.test/refunds?month=08"}, success: false, error: "HTTP 429 Too Many Requests"}
          - {t: "00:11", type: tool_call, id: c3, tool: Bash, input: {command: "curl -s https://api.example.test/refunds?month=08"}, success: false, error: "HTTP 429 Too Many Requests"}
          - {t: "00:19", type: tool_call, id: c4, tool: Bash, input: {command: "curl -s https://api.example.test/refunds?month=08"}, success: true, output: "[... 214 records ...]"}
    expect:
      episodes: []

  - id: D03-N4
    detector: D03
    about: одинаковая ошибка на разных заявках — это не повтор одного вызова
    sessions:
      - session_id: s-d03-n4
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Закрой обращения 100482, 100483 и 100484"}
          - {t: "00:20", type: tool_call, id: c1, tool: mcp__crm__ticket_close, input: {id: "100482"}, success: false, error: "status transition not allowed"}
          - {t: "00:40", type: tool_call, id: c2, tool: mcp__crm__ticket_close, input: {id: "100483"}, success: false, error: "status transition not allowed"}
          - {t: "01:00", type: tool_call, id: c3, tool: mcp__crm__ticket_close, input: {id: "100484"}, success: false, error: "status transition not allowed"}
    expect:
      episodes: []
    note: "input_hash одинаковый (<n>), input_exact_hash разный — три разных вызова, а не повтор"

  - id: D07-P1
    detector: D07
    about: нет прав на таблицу — три разных команды упираются в одно и то же
    sessions:
      - session_id: s-d07-p1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Посчитай сумму возвратов за август из базы"}
          - {t: "00:20", type: tool_call, id: c1, tool: Bash, input: {command: "psql -c 'select sum(amount) from payments.refunds'"}, success: false, error: "ERROR: permission denied for table refunds"}
          - {t: "00:50", type: tool_call, id: c2, tool: Bash, input: {command: "psql -c 'select count(*) from payments.refunds'"}, success: false, error: "ERROR: permission denied for table refunds"}
          - {t: "01:30", type: tool_call, id: c3, tool: Bash, input: {command: "psql -c 'select * from payments.refunds limit 5'"}, success: false, error: "ERROR: permission denied for table refunds"}
          - {t: "02:00", type: agent_stop, turn: 1, final_message: "Нет доступа к таблице возвратов."}
    expect:
      episodes:
        - {pattern: D07, evidence: [c1, c2, c3], severity: medium}

  - id: D07-N1
    detector: D07
    about: отсутствующий файл создан, следующий вызов успешен
    sessions:
      - session_id: s-d07-n1
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Подготовь конфиг сверки"}
          - {t: "00:10", type: tool_call, id: c1, tool: Bash, input: {command: "cat config/reconcile.yaml"}, success: false, error: "cat: config/reconcile.yaml: No such file or directory"}
          - {t: "00:30", type: tool_call, id: c2, tool: apply_patch, input: {path: "config/reconcile.yaml"}, success: true}
          - {t: "00:40", type: tool_call, id: c3, tool: Bash, input: {command: "cat config/reconcile.yaml"}, success: true, output: "month: 08"}
    expect:
      episodes: []

  - id: D24-P1
    detector: D24
    about: MCP-сервер отвечает 401, агент продолжает к нему обращаться
    sessions:
      - session_id: s-d24-p1
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Проверь статусы возвратов по списку"}
          - {t: "00:15", type: tool_call, id: c1, tool: mcp__payments__get_refund_status, input: {refund_id: "R-1001"}, success: false, error: "401 Unauthorized: token expired"}
          - {t: "00:40", type: tool_call, id: c2, tool: mcp__payments__get_refund_status, input: {refund_id: "R-1002"}, success: false, error: "401 Unauthorized: token expired"}
          - {t: "01:05", type: tool_call, id: c3, tool: mcp__payments__list_refunds, input: {month: "08"}, success: false, error: "401 Unauthorized: token expired"}
          - {t: "01:30", type: agent_stop, turn: 1, final_message: "Не удалось получить статусы."}
    expect:
      episodes:
        - {pattern: D24, mcp_server: payments, evidence: [c1, c2, c3], severity: high}

  - id: D24-P2
    detector: D24
    about: сервер падает в двух сессиях за неделю, в каждой агент повторяет обращение
    sessions:
      - session_id: s-d24-p2a
        agent: codex
        day: 1
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Статус возврата R-2001"}
          - {t: "00:10", type: tool_call, id: a1, tool: mcp__payments__get_refund_status, input: {refund_id: "R-2001"}, success: false, error: "401 Unauthorized"}
          - {t: "00:30", type: tool_call, id: a2, tool: mcp__payments__get_refund_status, input: {refund_id: "R-2001"}, success: false, error: "401 Unauthorized"}
      - session_id: s-d24-p2b
        agent: claude
        day: 4
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Список возвратов за сентябрь"}
          - {t: "00:12", type: tool_call, id: b1, tool: mcp__payments__list_refunds, input: {month: "09"}, success: false, error: "401 Unauthorized"}
          - {t: "00:35", type: tool_call, id: b2, tool: mcp__payments__list_refunds, input: {month: "09"}, success: false, error: "401 Unauthorized"}
    expect:
      episodes:
        - {pattern: D24, mcp_server: payments, evidence: [a1, a2, b1, b2], sessions: [s-d24-p2a, s-d24-p2b]}

  - id: D24-N1
    detector: D24
    about: единичный лимит и успешный повтор
    sessions:
      - session_id: s-d24-n1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Найди клиента в CRM"}
          - {t: "00:10", type: tool_call, id: c1, tool: mcp__crm__search, input: {q: "ООО Пример"}, success: false, error: "429 rate limit"}
          - {t: "00:14", type: tool_call, id: c2, tool: mcp__crm__search, input: {q: "ООО Пример"}, success: true, output: "1 result"}
    expect:
      episodes: []

  - id: D12-P1
    detector: D12
    about: ошибка, исправленная до компакции, возвращается после неё
    sessions:
      - session_id: s-d12-p1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Сверь возвраты за август и сделай отчёт"}
          - {t: "05:00", type: tool_call, id: c1, tool: Bash, input: {command: "python reconcile.py --month 08"}, success: false, error: "KeyError: 'amount_eur'"}
          - {t: "05:40", type: tool_call, id: c2, tool: Edit, input: {file_path: "reconcile.py"}, success: true}
          - {t: "06:00", type: tool_call, id: c3, tool: Bash, input: {command: "python reconcile.py --month 08"}, success: true, output: "total: 12 450.00"}
          - {t: "06:30", type: agent_stop, turn: 1, final_message: "Сверка за август прошла."}
          - {t: "07:00", type: human_turn, turn: 2, text: "Теперь добавь разбивку по методам оплаты"}
          - {t: "20:00", type: compaction, id: k1}
          - {t: "21:00", type: tool_call, id: c4, tool: Edit, input: {file_path: "reconcile.py"}, success: true}
          - {t: "21:30", type: tool_call, id: c5, tool: Bash, input: {command: "python reconcile.py --month 08"}, success: false, error: "KeyError: 'amount_eur'"}
    expect:
      episodes:
        - {pattern: D12, evidence: [k1, c1, c3, c5]}

  - id: D12-N1
    detector: D12
    about: после компакции агент перечитывает файлы, повторов нет
    sessions:
      - session_id: s-d12-n1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Подготовь концепт по итогам ресёрча"}
          - {t: "15:00", type: compaction, id: k1}
          - {t: "15:20", type: tool_call, id: c1, tool: Read, input: {file_path: "research/A.md"}, success: true}
          - {t: "15:30", type: tool_call, id: c2, tool: Read, input: {file_path: "research/B.md"}, success: true}
          - {t: "15:40", type: tool_call, id: c3, tool: Read, input: {file_path: "research/C.md"}, success: true}
          - {t: "16:30", type: tool_call, id: c4, tool: Write, input: {file_path: "concept.md"}, success: true}
    expect:
      episodes: []

  - id: D13-P1
    detector: D13
    about: проверенное задание дороже двух медиан своего класса
    baseline:
      goal_category: finance_reconcile
      task_tokens: [100000, 120000, 90000, 110000, 105000]
    sessions:
      - {session_id: s-d13-p1, agent: codex, task: {task_id: t1, outcome: verified, goal_category: finance_reconcile, tokens: 260000}}
    expect:
      episodes:
        - {pattern: D13, evidence: [s-d13-p1:t1], cost_tokens_over_median: 155000}

  - id: D13-N1
    detector: D13
    about: задание дороже медианы, но меньше порога
    baseline:
      goal_category: finance_reconcile
      task_tokens: [100000, 120000, 90000, 110000, 105000]
    sessions:
      - {session_id: s-d13-n1, agent: codex, task: {task_id: t1, outcome: verified, goal_category: finance_reconcile, tokens: 190000}}
    expect:
      episodes: []

  - id: D13-P2
    detector: D13
    about: независимый запуск внутри дневного задания сравнивается с предыдущими запусками той же инструкции
    baseline:
      operation: scheduled_queue_check
      prompt_version: sha256-example
      completed_run_tokens: [100000, 120000, 90000, 110000, 105000]
      period_days: 30
    sessions:
      - {session_id: s-d13-aggregate, agent: codex, task: {task_id: day-1, outcome: verified, runs: [{run_id: r6, outcome: verified, prompt_version: sha256-example, start: 10, end: 20, tokens: 260000}]}}
    expect:
      episodes:
        - {pattern: D13, evidence: [s-d13-aggregate:day-1:r6], cost_tokens_over_median: 155000}

  - id: D16-P1
    detector: D16
    about: агент задаёт вопросы по одному, человек каждый раз отвечает через несколько минут
    sessions:
      - session_id: s-d16-p1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Подготовь письмо партнёру о новом графике выплат"}
          - {t: "01:00", type: agent_stop, turn: 1, final_message: "С какой даты действует новый график?"}
          - {t: "05:00", type: human_turn, turn: 2, text: "С 1 октября"}
          - {t: "06:00", type: agent_stop, turn: 3, final_message: "Писать от вашего имени или от компании?"}
          - {t: "12:00", type: human_turn, turn: 4, text: "От компании"}
          - {t: "13:00", type: agent_stop, turn: 5, final_message: "Нужно ли упомянуть комиссии?"}
          - {t: "16:00", type: human_turn, turn: 6, text: "Нет"}
    expect:
      episodes:
        - {pattern: D16, evidence: [1, 2, 3, 4, 5, 6], cost_minutes: 13}

  - id: D16-P2
    detector: D16
    about: долгое ожидание решений по разрешениям
    sessions:
      - session_id: s-d16-p2
        agent: codex
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Обнови зависимости и прогони тесты"}
          - {t: "00:30", type: permission, call_id: c1, decided_after_s: 150, decision: approved}
          - {t: "04:00", type: permission, call_id: c2, decided_after_s: 90, decision: approved}
          - {t: "08:00", type: permission, call_id: c3, decided_after_s: 120, decision: approved}
    expect:
      episodes:
        - {pattern: D16, evidence: [c1, c2, c3], cost_minutes: 6}

  - id: D16-N1
    detector: D16
    about: долгая пауза без вопроса агента — человек отошёл
    sessions:
      - session_id: s-d16-n1
        agent: claude
        events:
          - {t: "00:00", type: human_turn, turn: 0, text: "Собери черновик отчёта"}
          - {t: "03:00", type: agent_stop, turn: 1, final_message: "Черновик в reports/draft.md."}
          - {t: "43:00", type: human_turn, turn: 2, text: "Добавь раздел с рисками"}
    expect:
      episodes: []

  - id: D22-P1
    detector: D22
    about: три одинаковых проверенных задания оформления в разных сессиях — кандидат в скрипт
    sessions:
      - {session_id: s-d22-a, agent: codex, session_verdict: partial, task: {task_id: t1, outcome: verified, operation: {input: filled_fields, result: uploaded_pdf, exceptions: none}, tokens: 50000, steps: [read_template, fill_fields, render_pdf, upload, notify]}}
      - {session_id: s-d22-b, agent: codex, session_verdict: partial, task: {task_id: t2, outcome: verified, operation: {input: filled_fields, result: uploaded_pdf, exceptions: none}, tokens: 55000, steps: [read_template, fill_fields, render_pdf, upload, notify]}}
      - {session_id: s-d22-c, agent: codex, session_verdict: unknown, task: {task_id: t3, outcome: verified, operation: {input: filled_fields, result: uploaded_pdf, exceptions: none}, tokens: 52000, steps: [read_template, fill_fields, fill_fields, render_pdf, upload, notify]}}
    expect:
      episodes:
        - {pattern: D22, evidence: [s-d22-a:t1, s-d22-b:t2, s-d22-c:t3]}

  - id: D22-N1
    detector: D22
    about: общая тема релиза при разных входах и путях проверки не образует одну операцию
    sessions:
      - {session_id: s-d22-r1, task: {task_id: t1, outcome: verified, operation: {input: docker_image, result: live_web_app, exceptions: health_and_ui}, tokens: 50000, steps: [build_image, deploy_compose, check_health, check_browser]}}
      - {session_id: s-d22-r2, task: {task_id: t2, outcome: verified, operation: {input: dns_zone, result: resolved_domain, exceptions: propagation}, tokens: 52000, steps: [edit_dns, wait_propagation, check_resolver, check_browser]}}
      - {session_id: s-d22-r3, task: {task_id: t3, outcome: verified, operation: {input: mobile_build, result: store_release, exceptions: signing}, tokens: 51000, steps: [archive_xcode, upload_store, wait_review, check_store]}}
    expect:
      episodes: []
