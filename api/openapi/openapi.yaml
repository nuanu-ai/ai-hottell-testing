        severity:
          description: >-
            The colleague's _severity (conclusions.py) over the published reports of the proposal's
            sources: bad only when an observation or check of its pattern is confirmed; warn when one is
            suspected or the priority is high or medium; info otherwise
          allOf:
            - $ref: "#/components/schemas/AnalyticsSeverity"
        axes:
          $ref: "#/components/schemas/ProposalAxes"
        target:
          $ref: "#/components/schemas/ProposalTarget"
        change:
          type: string
          nullable: true
        cause:
          type: string
          nullable: true
        preconditions:
          type: array
          items:
            type: string
        verification:
          type: string
          nullable: true
        rollback:
          type: string
          nullable: true
        expected_effect:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProposalSource"
        history_review:
          type: array
          description: Why the axes are as they are, the journal records that moved them
          items:
            type: string
        recurrence:
          $ref: "#/components/schemas/ProposalRecurrence"
    ProposalAxes:
      type: object
      required: [readiness, decision, execution, effect]
      properties:
        readiness:
          $ref: "#/components/schemas/ProposalReadiness"
        readiness_reason:
          type: string
        decision:
          $ref: "#/components/schemas/ProposalDecision"
        execution:
          $ref: "#/components/schemas/ProposalExecution"
        effect:
          $ref: "#/components/schemas/ProposalEffect"
    ProposalDecision:
      type: object
      required: [status, note]
      properties:
        status:
          $ref: "#/components/schemas/ProposalDecisionStatus"
        note:
          type: string
    ProposalExecution:
      type: object
      required: [status, at, version, evidence]
      properties:
        status:
          $ref: "#/components/schemas/ProposalExecutionStatus"
        at:
          type: string
        version:
          type: string
        evidence:
          type: array
          items:
            type: string
    ProposalEffect:
      type: object
      required: [status, method, metric, n_before, n_after, note]
      properties:
        status:
          $ref: "#/components/schemas/ProposalEffectStatus"
        method:
          type: string
        metric:
          type: string
        n_before:
          type: integer
        n_after:
          type: integer
        note:
          type: string
    ProposalTarget:
      type: object
      required: [kind, locator, version]
      properties:
        kind:
          type: string
        locator:
          type: string
        version:
          type: string
    ProposalSource:
      type: object
      required: [session_id, task_id, source_sha256, evidence]
      properties:
        session_id:
          type: string
        task_id:
          type: string
        source_sha256:
          type: string
        evidence:
          type: array
          description: Lines of the source, L<n>
          items:
            type: string
    ProposalRecurrence:
      description: The fold of the coach's checks; absent without one
      type: object
      required: [result, observations, repeats, checked_at, checks]
      properties:
        result:
          type: string
          enum: [repeated, not_repeated, not_enough_data]
        observations:
          type: integer
          nullable: true
        repeats:
          type: integer
          nullable: true
        checked_at:
          type: string
          format: date-time
        checks:
          type: integer
    DecisionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected, revision_requested]
        note:
          type: string
          maxLength: 2000
    Journal:
      type: object
      required: [entries, cycle]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        cycle:
          $ref: "#/components/schemas/ImprovementCycle"
    JournalEntry:
      description: >-
        A coach decision with its checks folded in, or a lifecycle event of a proposal. record is the
        record's canonical form, masked; the other fields are lifted from it for the page.
      type: object
      required: [record_id, kind, recorded_at, user_id, user_name, record]
      properties:
        record_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [decision, application, effect, coach_decision]
        recorded_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        proposal_id:
          type: string
        topic_key:
          type: string
        decision:
          type: string
          description: The coach's decision, or the status of a decision event
        result:
          type: string
          description: The last check's result of a coach decision
          enum: [repeated, not_repeated, not_enough_data]
        observations:
          type: integer
        repeats:
          type: integer
        checked_at:
          type: string
          format: date-time
        checks:
          type: integer
        record:
          type: object
          additionalProperties: true
    ImprovementCycle:
      description: Steps 4–6 of the improvement cycle over the journal of the period
      type: object
      required: [discussed, applied, checked, checked_of, empty]
      properties:
        discussed:
          type: integer
        applied:
          type: integer
        checked:
          type: integer
        checked_of:
          type: integer
          description: The N of «checked of N», equal to applied
        empty:
          type: boolean
          description: The journal has no record in the period
    JournalVerification:
      type: object
      required: [ok, records]
      properties:
        ok:
          type: boolean
        records:
          type: integer
          format: int64
        at_seq:
          type: integer
          format: int64
          description: The first record whose hash or link does not hold; only when ok is false
    SkillOpportunities:
      type: object
      required: [stale]
      properties:
        submitted_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: The set of published Deep reports changed since the report was made
        report:
          type: object
          description: The validated skill_opportunities report; absent when the user has none
          additionalProperties: true
