openapi: 3.0.3
info:
  title: harness-telemetry API
  version: 0.1.0
servers:
  - url: /api
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: Open without a session. Opens a session and sets its cookie.
      parameters:
        - name: User-Agent
          in: header
          required: false
          description: Kept with the session to tell the signed-in browsers apart
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          description: invalid_credentials — wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /auth/passkey/login/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Begin signing in with a passkey
      description: >-
        Open without a session. No email is asked: any discoverable passkey of a user
        answers. Sets the ht_webauthn cookie of the ceremony, which lives 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginPasskeyLoginRequest"
      responses:
        "200":
          description: The options for navigator.credentials.get
          headers:
            Set-Cookie:
              $ref: "#/components/headers/WebAuthnCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        default:
          $ref: "#/components/responses/Error"
  /auth/passkey/login/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish signing in with a passkey
      description: >-
        Open without a session. Verifies the answer of the browser against the ceremony
        of the ht_webauthn cookie, opens a session, sets its cookie and deletes ht_webauthn.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/WebAuthnCeremony"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredentialRequest"
      responses:
        "204":
          description: Signed in; Set-Cookie carries ht_session and the deleted ht_webauthn
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/PasskeyCeremonyFailed"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Closes the session of the request and deletes its cookie.
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user of the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the password of the signed-in user
      description: Needs the current password; closes every other session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: wrong_current_password, password_too_short or password_too_long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: The passkeys of the signed-in user
      responses:
        "200":
          description: The passkeys, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Begin adding a passkey to the signed-in user
      description: Sets the ht_webauthn cookie of the ceremony, which lives 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginPasskeyRegistrationRequest"
      responses:
        "200":
          description: The options for navigator.credentials.create
          headers:
            Set-Cookie:
              $ref: "#/components/headers/WebAuthnCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "400":
          description: invalid_passkey_name — the name is not 1–64 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish adding a passkey to the signed-in user
      description: >-
        Verifies the answer of the browser against the ceremony of the ht_webauthn cookie,
        stores the passkey under the name given at the begin and deletes ht_webauthn.
      parameters:
        - $ref: "#/components/parameters/WebAuthnCeremony"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredentialRequest"
      responses:
        "201":
          description: The passkey added; Set-Cookie carries the deleted ht_webauthn
          headers:
            Set-Cookie:
              $ref: "#/components/headers/WebAuthnCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyItem"
        "400":
          $ref: "#/components/responses/PasskeyCeremonyFailed"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMyPasskey
      summary: Delete a passkey of the signed-in user
      description: The password stays, so the user can still sign in.
      responses:
        "204":
          description: Passkey deleted
        "404":
          description: passkey_not_found — no such passkey of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/keys:
    get:
      operationId: getMyKeys
      summary: The state of the MCP key and the collector token of the signed-in user
      responses:
        "200":
          description: Whether each key is active, when it was created and last used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeysStatus"
        default:
          $ref: "#/components/responses/Error"
  /me/keys/mcp:
    post:
      operationId: issueMyMcpKey
      summary: Issue the MCP key of the signed-in user
      description: >-
        Issues a new MCP key and revokes the one the user had. Its open value is answered
        once: only its hash is kept.
      responses:
        "201":
          description: The open value of the key and where to connect the agent with it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedMcpKey"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeMyMcpKey
      summary: Revoke the MCP key of the signed-in user
      responses:
        "204":
          description: Key revoked
        "404":
          description: access_key_not_found — the user has no active MCP key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/keys/ingest/reissue:
    post:
      operationId: reissueMyIngestToken
      summary: Reissue the collector token of the signed-in user
      description: >-
        Issues a new collector token and revokes the one the user had: sending stops on
        every machine until the binary gets the new token through MCP. The open value is
        not answered here; only the binary gets it, through MCP.
      responses:
        "204":
          description: Token reissued
        default:
          $ref: "#/components/responses/Error"
  /me/telemetry-settings:
    get:
      operationId: getMyTelemetrySettings
      summary: The deny settings of the signed-in user and their version
      description: >-
        The settings in full form, every field with its default included; the defaults and
        version 0 when the user has never saved settings.
      responses:
        "200":
          description: The settings and their version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionedTelemetrySettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMyTelemetrySettings
      summary: Save the deny settings of the signed-in user in place of the version they were read at
      description: >-
        Saves settings in place of expectedVersion and tells the MCP subscribers of the user.
        An absent field takes its default. Settings equal to the stored ones keep the version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTelemetrySettingsRequest"
      responses:
        "200":
          description: The saved settings in full form and their new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionedTelemetrySettings"
        "409":
          description: settings_version_conflict — the settings are no longer at expectedVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: invalid_telemetry_settings — the settings break the schema; detail tells where and why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTelemetrySettingsError"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: Every user, invited ones included
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: inviteUser
      summary: Invite a user
      description: Creates an invited user and a one-time invitation link that lives 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: The invited user and the invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUserResponse"
        "400":
          description: invalid_email or invalid_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: email_taken — another user has the email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: revokeInvite
      summary: Revoke the invitation
      description: Deletes the invited user together with the invitation link.
      responses:
        "204":
          description: Invitation revoked
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: user_not_invited — the user has accepted the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/invite:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: reissueInvite
      summary: Reissue the invitation link
      description: Issues a new invitation link; the previous one stops working.
      responses:
        "200":
          description: The new invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: user_not_invited — the user has accepted the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: issuePasswordReset
      summary: Issue a password reset link to another active user
      description: Issues a one-time reset link that lives 7 days; the previous unused one stops working.
      responses:
        "200":
          description: The reset link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetLink"
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: user_not_active — the invitation is not accepted; cannot_reset_self — the own password is changed in the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /invites/{token}:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    get:
      operationId: getInvite
      summary: The user an invitation link was issued to
      description: Open without a session.
      responses:
        "200":
          description: The invited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkHolder"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /invites/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    post:
      operationId: acceptInvite
      summary: Accept the invitation by setting a password
      description: Open without a session. Uses the link up, signs the user in and sets the session cookie.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Invitation accepted, signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          description: password_too_short or password_too_long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /password-resets/{token}:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    get:
      operationId: getPasswordReset
      summary: The user a password reset link was issued to
      description: Open without a session.
      responses:
        "200":
          description: The user whose password the link resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkHolder"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /password-resets/{token}/complete:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    post:
      operationId: completePasswordReset
      summary: Set a new password by the reset link
      description: >-
        Open without a session. Uses the link up, closes every session of the user,
        signs the user in and sets the session cookie.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Password set, signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          description: password_too_short or password_too_long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "410":
          $ref: "#/components/responses/LinkGone"
        default:
          $ref: "#/components/responses/Error"
  /version:
    get:
      operationId: getVersion
      summary: Service build version
      responses:
        "200":
          description: The version the service was built with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /analytics/dataset:
    get:
      operationId: getAnalyticsDataset
      summary: The live analytics dataset for the filter
      description: >-
        Sessions with a hook event inside the window and the aggregates, cards and summary built
        over them. Every signed-in user sees every user; user is only a filter.
      parameters:
        - name: days
          in: query
          required: false
          description: The window is the last days days; without it the default window
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - $ref: "#/components/parameters/AnalyticsAgent"
        - name: project
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsUser"
        - name: tz
          in: query
          required: false
          description: >-
            The browser's zone, an IANA name or an offset ±HH:MM; each session's daily is laid out
            by its days. UTC days without it.
          schema:
            type: string
            maxLength: 64
        - name: kind
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AnalyticsSessionKind"
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of a dataset the client holds; the same dataset answers 304
          schema:
            type: string
      responses:
        "200":
          description: The dataset
          headers:
            ETag:
              description: Identifies this dataset's body; the same body has the same ETag
              schema:
                type: string
            Cache-Control:
              description: private, no-cache — the browser keeps the body and asks again each time
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDataset"
        "304":
          description: The dataset If-None-Match names is still the current one
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "400":
          description: invalid_filter — a parameter is out of range; message names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /analytics/team:
    get:
      operationId: getAnalyticsTeam
      summary: Every person's numbers for «Команда»
      description: >-
        One row per person with sessions in the period, counted as «Обзор» counts one person's
        sessions; no sessions and no aggregates. Built from the dataset of everyone for the period,
        which the server caches; agent, project and kind only choose its sessions.
      parameters:
        - name: days
          in: query
          required: false
          description: The period is the last days days; 365 without it
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - $ref: "#/components/parameters/AnalyticsAgent"
        - name: project
          in: query
          required: false
          description: A project's name; «без проекта» chooses the sessions without one
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: work (the default) leaves the service sessions out, all keeps them
          schema:
            type: string
            enum: [work, all]
      responses:
        "200":
          description: The people and what the filters of the page need
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsTeam"
        "400":
          description: invalid_filter — a parameter is out of range; message names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /analytics/sessions/{id}:
    get:
      operationId: getAnalyticsSession
      summary: The timeline of one session
      description: >-
        id is the agent's session id, not ours; agent and user tell apart sessions that share it.
        not_found — no such session; ambiguous_session (409) — several sessions match, pass agent and user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsAgent"
        - $ref: "#/components/parameters/AnalyticsUser"
      responses:
        "200":
          description: The timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsTimeline"
        default:
          $ref: "#/components/responses/Error"
  /analytics/pulse:
    get:
      operationId: getAnalyticsPulse
      summary: Hook events of the last 10 minutes and the running sessions
      parameters:
        - $ref: "#/components/parameters/AnalyticsUser"
        - $ref: "#/components/parameters/AnalyticsAgent"
      responses:
        "200":
          description: The pulse; on a read failure bars and active are empty and error says why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsPulse"
        default:
          $ref: "#/components/responses/Error"
  /analytics/delivery:
    get:
      operationId: getAnalyticsDelivery
      summary: How sending works for a user, by what the server knows
      description: For user when given, else for the signed-in user.
      parameters:
        - $ref: "#/components/parameters/AnalyticsUser"
      responses:
        "200":
          description: The delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDelivery"
        default:
          $ref: "#/components/responses/Error"
  /analytics/hidden-topics:
    get:
      operationId: listHiddenTopics
      summary: The topics the signed-in user marked «not a problem»
      responses:
        "200":
          description: The hidden topic keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiddenTopics"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearHiddenTopics
      summary: Show all hidden topics of the signed-in user again
      responses:
        "204":
          description: No topic is hidden any more
        default:
          $ref: "#/components/responses/Error"
  /analytics/hidden-topics/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The topic key, a card id
        schema:
          type: string
          minLength: 1
          maxLength: 200
    put:
      operationId: hideTopic
      summary: Hide a topic for the signed-in user
      responses:
        "204":
          description: Hidden; hiding a hidden topic again is not an error
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unhideTopic
      summary: Show a hidden topic again
      responses:
        "204":
          description: Shown; showing a topic that was not hidden is not an error
        default:
          $ref: "#/components/responses/Error"
  /deep/reports:
    get:
      operationId: listDeepReports
      summary: Published Deep reports
      description: Every signed-in user reads the reports of every user; user is only a filter.
      parameters:
        - $ref: "#/components/parameters/AnalyticsUser"
        - $ref: "#/components/parameters/AnalyticsAgent"
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
      responses:
        "200":
          description: The reports, the newest published first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepReportList"
        default:
          $ref: "#/components/responses/Error"
  /deep/reports/{sessionId}:
    get:
      operationId: getDeepReport
      summary: The Deep report of a session
      description: >-
        The published report and the unchecked candidate, if any. not_found — the session has neither;
        ambiguous_session (409) — several sessions match, pass agent and user.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsUser"
        - $ref: "#/components/parameters/AnalyticsAgent"
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepReport"
        default:
          $ref: "#/components/responses/Error"
  /proposals:
    get:
      operationId: listProposals
      summary: The proposal registry
      description: Each user has their own registry; every signed-in user reads all of them.
      parameters:
        - $ref: "#/components/parameters/AnalyticsUser"
        - name: readiness
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProposalReadiness"
        - name: decision
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProposalDecisionStatus"
      responses:
        "200":
          description: The proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        default:
          $ref: "#/components/responses/Error"
  /proposals/{userId}/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/ProposalUserID"
      - $ref: "#/components/parameters/ProposalID"
    get:
      operationId: getProposal
      summary: One proposal of a user's registry
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        default:
          $ref: "#/components/responses/Error"
  /proposals/{userId}/{proposalId}/decisions:
    parameters:
      - $ref: "#/components/parameters/ProposalUserID"
      - $ref: "#/components/parameters/ProposalID"
    post:
      operationId: decideProposal
      summary: Record the owner's decision on a proposal
      description: >-
        Writes a decision event to the decision journal with authority_ref web:<user id>.
        forbidden (403) — only the registry's owner decides; decision_after_application (409) —
        cannot change decision after application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "201":
          description: Recorded; the proposal as the registry now projects it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        default:
          $ref: "#/components/responses/Error"
  /journal:
    get:
      operationId: getJournal
      summary: The decision journal («Fixed») and the improvement cycle counters
      parameters:
        - $ref: "#/components/parameters/AnalyticsUser"
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
      responses:
        "200":
          description: The folded entries, the newest first, and the counters of the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        default:
          $ref: "#/components/responses/Error"
  /journal/verify:
    get:
      operationId: verifyJournal
      summary: Check the hash chain of the decision journal
      responses:
        "200":
          description: The result of the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalVerification"
        default:
          $ref: "#/components/responses/Error"
  /skill-opportunities:
    get:
      operationId: getSkillOpportunities
      summary: The current skill opportunities report of a user
      description: For user when given, else for the signed-in user.
      parameters:
        - $ref: "#/components/parameters/AnalyticsUser"
      responses:
        "200":
          description: The report, or report null when the user has none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillOpportunities"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    AnalyticsAgent:
      name: agent
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AnalyticsAgent"
    AnalyticsUser:
      name: user
      in: query
      required: false
      description: A filter by user, not an access check; every signed-in user sees every user
      schema:
        type: string
        format: uuid
    PeriodFrom:
      name: from
      in: query
      required: false
      description: Start of the period, inclusive
      schema:
        type: string
        format: date-time
    PeriodTo:
      name: to
      in: query
      required: false
      description: End of the period, exclusive
      schema:
        type: string
        format: date-time
    ProposalUserID:
      name: userId
      in: path
      required: true
      description: The owner of the registry
      schema:
        type: string
        format: uuid
    ProposalID:
      name: proposalId
      in: path
      required: true
      description: The proposal id, p2:<20 hex>
      schema:
        type: string
        pattern: "^p2:[0-9a-f]{20}$"
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkToken:
      name: token
      in: path
      required: true
      description: The token of a one-time link; never written to logs
      schema:
        type: string
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: Kept with the session to tell the signed-in browsers apart
      schema:
        type: string
    WebAuthnCeremony:
      name: ht_webauthn
      in: cookie
      required: false
      description: The ceremony begun by the matching begin operation; without it the answer is passkey_ceremony_expired
      schema:
        type: string
  headers:
    WebAuthnCookie:
      description: The ht_webauthn cookie of a WebAuthn ceremony, HttpOnly, SameSite=Strict and Path=/api; set on begin, deleted on finish
      schema:
        type: string
    SessionCookie:
      description: The ht_session cookie, HttpOnly and SameSite=Lax; set on sign-in, cleared on sign-out
      schema:
        type: string
  responses:
    PasskeyCeremonyFailed:
      description: >-
        passkey_verification_failed — the answer of the browser does not verify;
        passkey_ceremony_expired — no ceremony, or it expired or was finished already
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LinkNotFound:
      description: link_not_found — no such link
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LinkGone:
      description: link_used or link_expired — the link cannot be used any more
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Any 4xx or 5xx answer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    BeginPasskeyLoginRequest:
      type: object
    BeginPasskeyRegistrationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: The publicKey member of the options the browser passes to the authenticator
    PasskeyCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential of the browser, serialized to JSON
    PasskeyItem:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyItem"
    KeyStatus:
      type: object
      required: [active, createdAt, lastUsedAt]
      properties:
        active:
          type: boolean
          description: The user has an active key of this kind
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the active key was created; null when there is none
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When the active key was last used, recorded at most once a minute; null until it is used or when there is none
    KeysStatus:
      type: object
      required: [mcp, ingest]
      properties:
        mcp:
          $ref: "#/components/schemas/KeyStatus"
        ingest:
          $ref: "#/components/schemas/KeyStatus"
    IssuedMcpKey:
      type: object
      required: [key, mcpUrl, serverName]
      properties:
        key:
          type: string
          description: The open value of the MCP key; shown once and never answered again
        mcpUrl:
          type: string
          description: The address of the MCP server, <HT_PUBLIC_ORIGIN>/mcp
        serverName:
          type: string
          description: The name the MCP server is added to the agent under, hottell
    VersionedTelemetrySettings:
      type: object
      required: [settings, version]
      properties:
        settings:
          $ref: "#/components/schemas/TelemetrySettings"
        version:
          type: integer
          format: int64
          minimum: 0
          description: The version of the settings, kept by the server; 0 before the first save
    UpdateTelemetrySettingsRequest:
      type: object
      required: [settings, expectedVersion]
      properties:
        settings:
          $ref: "#/components/schemas/TelemetrySettings"
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: The version the settings were read at
    InvalidTelemetrySettingsError:
      type: object
      required: [code, message, detail]
      properties:
        code:
          type: string
          description: invalid_telemetry_settings
        message:
          type: string
          description: Human-readable description
        detail:
          type: string
          description: Where in the settings and why they break the schema, e.g. agents.claude.hook_events.denied[0] unknown hook event
    TelemetrySettings:
      description: >-
        The deny settings document of a user, as docs/specs/hottell-contract/settings.schema.json
        describes it. An absent field takes its default: everything is sent, history is not
        backfilled. The server checks the document itself, so the handler takes it as is.
      type: object
      additionalProperties: false
      # The generated package imports encoding/json already.
      x-go-type: json.RawMessage
      properties:
        version:
          type: integer
          minimum: 0
          default: 0
          description: The version of the settings; kept by the server, never set by the client
        agents:
          type: object
          additionalProperties: false
          properties:
            claude:
              $ref: "#/components/schemas/ClaudeTelemetrySettings"
            codex:
              $ref: "#/components/schemas/CodexTelemetrySettings"
        folders:
          $ref: "#/components/schemas/FolderRules"
        backfill_history:
          type: boolean
          default: false
          description: Kind 7 "backfill history"
    ClaudeTelemetrySettings:
      type: object
      description: What is denied of Claude Code
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
          description: Kind 1 "agent"; false turns the agent off entirely
        sources:
          $ref: "#/components/schemas/TelemetrySources"
        hook_events:
          type: object
          description: Kind 3 "hook event"; the denied hook_event_name of the agent
          additionalProperties: false
          properties:
            denied:
              type: array
              uniqueItems: true
              default: []
              items:
                $ref: "#/components/schemas/ClaudeHookEvent"
        hook_fields:
          $ref: "#/components/schemas/DeniedHookFields"
        native_content:
          $ref: "#/components/schemas/DeniedNativeContent"
    CodexTelemetrySettings:
      type: object
      description: What is denied of Codex CLI
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
          description: Kind 1 "agent"; false turns the agent off entirely
        sources:
          $ref: "#/components/schemas/TelemetrySources"
        hook_events:
          type: object
          description: Kind 3 "hook event"; the denied hook_event_name of the agent
          additionalProperties: false
          properties:
            denied:
              type: array
              uniqueItems: true
              default: []
              items:
                $ref: "#/components/schemas/CodexHookEvent"
        hook_fields:
          $ref: "#/components/schemas/DeniedHookFields"
        native_content:
          $ref: "#/components/schemas/DeniedNativeContent"
    TelemetrySources:
      type: object
      description: Kind 2 "source"; false turns a source off
      additionalProperties: false
      properties:
        hooks:
          type: boolean
          default: true
        transcripts:
          type: boolean
          default: true
        native_metrics:
          type: boolean
          default: true
        native_logs:
          type: boolean
          default: true
        native_traces:
          type: boolean
          default: true
    DeniedHookFields:
      type: object
      description: Kind 4 "hook event field"; the denied top-level fields
      additionalProperties: false
      properties:
        denied:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/HookField"
    DeniedNativeContent:
      type: object
      description: Kind 6 "native OTel content category"
      additionalProperties: false
      properties:
        denied:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/NativeContentCategory"
    FolderRules:
      type: object
      description: Kind 5 "project folder", shared by both agents
      additionalProperties: false
      properties:
        denied:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/FolderPattern"
        allowed:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/FolderPattern"
    ClaudeHookEvent:
      type: string
      enum:
        - SessionStart
        - Setup
        - InstructionsLoaded
        - UserPromptSubmit
        - UserPromptExpansion
        - MessageDisplay
        - PreToolUse
        - PermissionRequest
        - PermissionDenied
        - PostToolUse
        - PostToolUseFailure
        - PostToolBatch
        - Notification
        - SubagentStart
        - SubagentStop
        - TaskCreated
        - TaskCompleted
        - Stop
        - StopFailure
        - TeammateIdle
        - ConfigChange
        - CwdChanged
        - DirectoryAdded
        - FileChanged
        - WorktreeCreate
        - WorktreeRemove
        - PreCompact
        - PostCompact
        - PreModelSwitch
        - PostModelSwitch
        - Elicitation
        - ElicitationResult
        - SessionEnd
    CodexHookEvent:
      type: string
      enum:
        - SessionStart
        - SessionEnd
        - UserPromptSubmit
        - PreToolUse
        - PermissionRequest
        - PostToolUse
        - PreCompact
        - PostCompact
        - SubagentStart
        - SubagentStop
        - Stop
        - Interrupt
    HookField:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      not:
        enum: [session_id, hook_event_name, cwd]
      description: A top-level field name; the service fields session_id, hook_event_name and cwd cannot be denied
    NativeContentCategory:
      type: string
      enum: [prompts, assistant_responses, tool_details, tool_content, raw_api_bodies]
    FolderPattern:
      type: string
      pattern: "^(/|~/)"
      description: A path pattern starting with / or ~/; ** matches any number of segments
    UserListItem:
      type: object
      required: [id, email, name, status, createdAt, lastLoginAt, inviteExpiresAt, isMe]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [invited, active]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiry of the unused invitation, past or not; null for an active user
        isMe:
          type: boolean
          description: The user is the signed-in one
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"
    InviteUserRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
        name:
          type: string
    InviteUserResponse:
      type: object
      required: [user, inviteUrl, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/UserListItem"
        inviteUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteLink:
      type: object
      required: [inviteUrl, expiresAt]
      properties:
        inviteUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    ResetLink:
      type: object
      required: [resetUrl, expiresAt]
      properties:
        resetUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    LinkHolder:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
        name:
          type: string
    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    Me:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Error:
      description: The common body of every 4xx and 5xx response
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. not_found
        message:
          type: string
          description: Human-readable description
    AnalyticsAgent:
      type: string
      enum: [claude, codex]
    AnalyticsSessionKind:
      type: string
      description: >-
        system — a service task of Codex; agent — a session another agent started (a codex exec
        run, a first prompt that is a cross-session message or an orchestrator's brief);
        automation — a <heartbeat> prompt; user — the rest
      enum: [system, agent, automation, user]
    AnalyticsSeverity:
      type: string
      enum: [bad, warn, info]
    AnalyticsDataset:
      description: >-
        The live dataset: the colleague's dataset.json in our form. Unknown is null, never 0.
        Aggregates are built over the filtered sessions; by_session lets the page recount a subset.
      type: object
      required:
        - schema_version
        - variant
        - generated_at
        - window
        - filter
        - facets
        - summary
        - pricing
        - gaps
        - sessions
        - tools
        - mcp
        - commands
        - permissions
        - friction
        - skills
        - findings
        - done
        - checks_catalog
      properties:
        schema_version:
          type: integer
        variant:
          type: string
          enum: [live]
        generated_at:
          type: string
          format: date-time
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        filter:
          $ref: "#/components/schemas/AnalyticsFilter"
        facets:
          $ref: "#/components/schemas/AnalyticsFacets"
        summary:
          $ref: "#/components/schemas/AnalyticsSummary"
        pricing:
          $ref: "#/components/schemas/AnalyticsPricing"
        gaps:
          type: array
          description: What is not collected and why
          items:
            type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSession"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsToolRow"
        mcp:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMcpRow"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsCommandRow"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsPermissionRow"
        friction:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsFriction"
        skills:
          $ref: "#/components/schemas/AnalyticsSkills"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsFinding"
        done:
          type: array
          description: Applied changes with their effect; empty in the live variant
          items:
            type: object
            additionalProperties: true
        checks_catalog:
          type: array
          description: The catalogue of checks; empty in the live variant
          items:
            $ref: "#/components/schemas/AnalyticsCheckDef"
    AnalyticsTeam:
      description: >-
        «Команда» for the period: each person's numbers over their chosen sessions. Unknown is null,
        never 0.
      type: object
      required: [generated_at, window, people, projects, has_system, gaps, session_gaps]
      properties:
        generated_at:
          type: string
          format: date-time
        window:
          description: The period; for «Всё», the window of the dataset
          allOf:
            - $ref: "#/components/schemas/AnalyticsWindow"
        people:
          description: The people with a chosen session, in no order
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsTeamPerson"
        projects:
          description: >-
            The projects of every session of the dataset (twice the period), whatever agent,
            project and kind say, for the filter of projects; «без проекта» stands for the
            sessions without one
          type: array
          items:
            type: string
        has_system:
          description: A session of the dataset is a service one, so the filter of them matters
          type: boolean
        gaps:
          description: The dataset's notes that are not about one session
          type: array
          items:
            type: string
        session_gaps:
          description: How many of the dataset's notes are about one session; they stay in its timeline
          type: integer
    AnalyticsTeamPerson:
      type: object
      required:
        - user_id
        - user_name
        - sessions
        - user_min
        - agent_min
        - cost_usd
        - cost_partial
        - error_rate
        - friction_sessions
        - last_active
        - pulse
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        sessions:
          description: The chosen sessions of kind user
          type: integer
        user_min:
          description: The person's minutes over the sessions that are neither automation nor agent
          type: number
          format: double
          nullable: true
        agent_min:
          description: The agent's active minutes over the same sessions
          type: number
          format: double
          nullable: true
        cost_usd:
          description: The cost of the chosen sessions with a known cost; null when none has one
          type: number
          format: double
          nullable: true
        cost_partial:
          description: Some chosen session has no cost, so cost_usd is a lower bound
          type: boolean
        error_rate:
          description: Tool errors over the calls with a known outcome; null without such calls
          type: number
          format: double
          nullable: true
        friction_sessions:
          description: The chosen sessions with a friction signal
          type: integer
        last_active:
          description: The latest end, or start without one, of the chosen sessions
          type: string
          format: date-time
        pulse:
          description: >-
            The person's hook events by hour over the 5 whole UTC days before today, whatever the
            filter; null when the telemetry store could not be read
          allOf:
            - $ref: "#/components/schemas/AnalyticsTeamPulse"
          nullable: true
    AnalyticsTeamPulse:
      description: >-
        Hook events of one person by hour over [from, to), all agents; read once a UTC day for
        everyone and kept until midnight
      type: object
      required: [from, to, bucket, values]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucket:
          type: string
          enum: [hour]
        values:
          description: One count per hour from `from`, oldest first, 120 of them; 0 for an hour without events
          type: array
          items:
            type: integer
    AnalyticsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AnalyticsFilter:
      description: The filter the dataset was built for, with its defaults filled in
      type: object
      required: [days, kind]
      properties:
        days:
          type: integer
        agent:
          $ref: "#/components/schemas/AnalyticsAgent"
        project:
          type: string
        user:
          type: string
          format: uuid
        kind:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSessionKind"
    AnalyticsFacets:
      description: The values the filter can take in the window
      type: object
      required: [agents, projects, users, kinds]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsAgent"
        projects:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsUserRef"
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSessionKind"
    AnalyticsUserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    AnalyticsSummary:
      type: object
      required: [coverage, funnel, period]
      properties:
        coverage:
          $ref: "#/components/schemas/AnalyticsCoverage"
        funnel:
          $ref: "#/components/schemas/AnalyticsFunnel"
        period:
          $ref: "#/components/schemas/AnalyticsPeriodTotals"
    AnalyticsCoverage:
      description: «Data completeness» — hooks from the start, known call outcome, recorded cost
      type: object
      required: [sessions, hooks_full, calls, outcome_known, cost_known, cost_usd, cost_basis]
      properties:
        sessions:
          type: integer
        hooks_full:
          type: integer
          description: Sessions whose hooks are recorded from the start
        calls:
